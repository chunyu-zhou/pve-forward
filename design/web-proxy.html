<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVE Forward · 转发规则（端口转发 + Web 转发）设计原型</title>
<link rel="stylesheet" href="vendor/arco.min.css">
<style>
  html, body, #app { height: 100%; margin: 0; }
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; background: var(--color-fill-2); }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .muted { color: var(--color-text-3); font-size: 12px; }

  /* 布局（与主原型一致） */
  .layout-navbar { position: fixed; top: 0; left: 0; z-index: 100; width: 100%; height: 60px; }
  .layout-sider { position: fixed !important; top: 0; left: 0; z-index: 99; height: 100%; padding-top: 60px; }
  .layout-sider::after { position: absolute; top: 0; right: -1px; display: block; width: 1px; height: 100%; background: var(--color-border); content: ''; }
  .menu-wrapper { height: 100%; overflow: auto; overflow-x: hidden; }
  .menu-wrapper .arco-menu-inner .arco-icon:not(.arco-icon-down) { font-size: 18px; }
  .layout-content { min-height: 100vh; background-color: var(--color-fill-2); padding-top: 60px; }
  .container { padding: 0 20px 20px 20px; }
  .navbar { display: flex; justify-content: space-between; height: 100%; background: var(--color-bg-2); border-bottom: 1px solid var(--color-border); }
  .navbar .left-side { display: flex; align-items: center; padding-left: 20px; }
  .logo-mark { width: 28px; height: 28px; border-radius: 6px; background: rgb(var(--primary-6)); color: #fff; display: grid; place-items: center; font-size: 16px; }
  .navbar .right-side { display: flex; padding-right: 20px; list-style: none; margin: 0; }
  .navbar .right-side li { display: flex; align-items: center; padding: 0 10px; }
  .container-breadcrumb { margin: 16px 0; }
  .general-card { border-radius: 4px; border: none; }
  .general-card > .arco-card-header { height: auto; padding: 20px; border: none; }
  .general-card > .arco-card-body { padding: 0 20px 20px 20px; }
  .circle { display: inline-block; margin-right: 4px; width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--gray-5)); vertical-align: middle; }
  .circle.pass { background: rgb(var(--green-6)); }
  .circle.err { background: rgb(var(--red-6)); }
  .circle.warn { background: rgb(var(--orange-6)); }
  .arco-table-td .arco-table-cell { white-space: nowrap; }
  .lines { line-height: 1.7; }
  .updown { line-height: 1.6; font-size: 12px; }
  .updown .d { color: rgb(var(--green-6)); } .updown .u { color: rgb(var(--orange-6)); }
  .grp-row .arco-table-td { background: var(--color-fill-1) !important; }
  .grp { display: flex; align-items: center; gap: 10px; }
  .grp .nm { font-weight: 500; color: var(--color-text-1); }
  .grp .info { display: flex; gap: 20px; margin-left: 12px; color: var(--color-text-3); font-size: 13px; }
  .grp .info b { color: var(--color-text-2); font-weight: 500; }

  /* 本原型 */
  .type-tabs { margin-bottom: 16px; }
  .form-tabs { margin: -8px 0 20px; }
  .domain-list a { color: rgb(var(--primary-6)); text-decoration: none; }
  .entry-port { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .entry-port .arco-radio { margin: 0; padding: 8px 10px; min-width: 0; border: 1px solid var(--color-border-2); border-radius: 4px; }
  .entry-port .arco-radio-checked { border-color: rgb(var(--primary-6)); background: rgb(var(--primary-1)); }
  .entry-port .pt { font-weight: 500; white-space: nowrap; }
  .entry-port .muted { white-space: nowrap; }
  .entry-port .arco-radio { position: relative; overflow: hidden; }
  .entry-port .def { position: absolute; top: 0; right: 0; padding: 0 6px; font-size: 12px; line-height: 18px; color: rgb(var(--primary-6)); background: rgb(var(--primary-2)); border-bottom-left-radius: 4px; }
  .domain-row { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 8px; }
  .domain-row .arco-input-group { flex: 1; }
  .domain-st { font-size: 12px; line-height: 20px; margin: -6px 0 6px; }
  .domain-st.ok { color: rgb(var(--green-6)); } .domain-st.bad { color: rgb(var(--red-6)); } .domain-st.wait { color: var(--color-text-3); }
  .adv-toggle { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; cursor: pointer; user-select: none; color: var(--color-text-2); }
  .adv-toggle::before, .adv-toggle::after { content: ''; flex: 1; border-top: 1px solid var(--color-border-2); }
  .adv-toggle:hover { color: rgb(var(--primary-6)); }
  .flow { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; background: var(--color-fill-1); border-radius: 4px; font-size: 13px; flex-wrap: wrap; }
  .flow .box { padding: 8px 12px; background: var(--color-bg-2); border: 1px solid var(--color-border-2); border-radius: 4px; text-align: center; line-height: 1.6; }
  .flow .box.hl { border-color: rgb(var(--primary-6)); background: rgb(var(--primary-1)); }
  .flow .arrow { color: var(--color-text-3); }
  .pem-upload { margin-bottom: 8px; }
  .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .mode-cards .arco-radio { margin: 0; padding: 12px 14px; border: 1px solid var(--color-border-2); border-radius: 4px; align-items: flex-start; }
  .mode-cards .arco-radio-checked { border-color: rgb(var(--primary-6)); background: rgb(var(--primary-1)); }
  .mode-cards .t { font-weight: 500; margin-bottom: 4px; }
  .mode-cards .d { font-size: 12px; color: var(--color-text-3); line-height: 1.7; white-space: normal; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; padding: 12px 16px; background: var(--color-fill-1); border-radius: 4px; font-size: 13px; }
  .checks .ok { color: rgb(var(--green-6)); } .checks .no { color: rgb(var(--red-6)); }
  .provider-type { display: inline-flex; align-items: center; gap: 6px; }
  .provider-type i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .proto-bar { position: fixed; right: 16px; bottom: 16px; z-index: 2000; background: var(--color-bg-2); border: 1px dashed var(--color-border-3); border-radius: 4px; padding: 8px 12px; box-shadow: 0 4px 10px rgb(0 0 0 / 8%); }
  .proto-bar .t { font-size: 12px; color: var(--color-text-3); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="tpl">
<a-layout class="layout">
  <div class="layout-navbar">
    <div class="navbar">
      <div class="left-side"><a-space><div class="logo-mark"><icon-swap /></div>
        <a-typography-title :style="{ margin: 0, fontSize: '18px' }" :heading="5">PVE Forward</a-typography-title></a-space></div>
      <ul class="right-side">
        <li><a-avatar :size="32" :style="{ backgroundColor: isAdmin ? '#165dff' : '#00b42a' }">{{ me[0].toUpperCase() }}</a-avatar></li>
      </ul>
    </div>
  </div>
  <a-layout>
    <a-layout-sider class="layout-sider" :width="220">
      <div class="menu-wrapper">
        <a-menu :selected-keys="[page]" :default-open-keys="['fwd']" style="height:100%;width:100%" @menu-item-click="k => (page = k)">
          <a-menu-item key="dash"><template #icon><icon-dashboard /></template>仪表盘</a-menu-item>
          <a-menu-item key="monitor"><template #icon><icon-desktop /></template>资源监控</a-menu-item>
          <a-sub-menu key="fwd"><template #icon><icon-swap /></template><template #title>转发管理</template>
            <a-menu-item key="rules">转发规则</a-menu-item>
            <a-menu-item v-if="isAdmin" key="webset">Web 转发设置 <a-tag size="small" color="arcoblue" style="margin-left:6px">新</a-tag></a-menu-item>
          </a-sub-menu>
          <a-sub-menu v-if="isAdmin" key="user"><template #icon><icon-user-group /></template><template #title>用户管理</template></a-sub-menu>
          <a-sub-menu v-if="isAdmin" key="pve"><template #icon><icon-cloud /></template><template #title>PVE 节点</template></a-sub-menu>
          <a-menu-item v-if="isAdmin" key="settings"><template #icon><icon-settings /></template>系统设置</a-menu-item>
        </a-menu>
      </div>
    </a-layout-sider>

    <a-layout class="layout-content" style="padding-left:220px">
      <a-layout-content>

<!-- ============================================================ 转发规则：端口转发 / Web 转发 -->
<div v-if="page === 'rules'" class="container">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>转发管理</a-breadcrumb-item><a-breadcrumb-item>转发规则</a-breadcrumb-item></a-breadcrumb>

  <a-card class="general-card" title="转发规则">
    <a-tabs v-model:active-key="kind" class="type-tabs" @change="selected = []">
      <a-tab-pane key="web"><template #title><icon-public /> Web 转发 <a-tag size="small" style="margin-left:4px">{{ visibleSites.length }}</a-tag></template></a-tab-pane>
      <a-tab-pane key="port"><template #title><icon-swap /> 端口转发 <a-tag size="small" style="margin-left:4px">{{ visiblePorts.length }}</a-tag></template></a-tab-pane>
    </a-tabs>

    <a-row :gutter="16" style="margin-bottom:16px">
      <a-col :flex="1">
        <a-space wrap>
          <a-input-search v-model="q.kw" :placeholder="kind === 'port' ? '端口 / 目标 IP / 备注' : '域名 / 目标 IP / 备注'" style="width:240px" allow-clear />
          <a-select v-model="q.node" placeholder="全部节点" style="width:140px" allow-clear :options="nodes.map(n => ({ label: n.name, value: n.id }))" />
          <a-select v-if="isAdmin" v-model="q.owner" placeholder="全部用户" style="width:140px" allow-clear :options="ownerOptions" />
          <a-select v-if="kind === 'web'" v-model="q.port" placeholder="全部入口" style="width:130px" allow-clear :options="webPorts.map(p => ({ label: portLabel(p), value: p }))" />
          <a-select v-model="q.status" placeholder="全部状态" style="width:120px" allow-clear :options="[{ label: '正常', value: 'on' }, { label: '异常', value: 'err' }, { label: '已停用', value: 'off' }]" />
        </a-space>
      </a-col>
      <a-col flex="none">
        <a-space>
          <a-button type="primary" @click="openForm()"><template #icon><icon-plus /></template>添加规则</a-button>
          <a-button :disabled="!selected.length" @click="batch(true)">批量启用</a-button>
          <a-button :disabled="!selected.length" @click="batch(false)">批量停用</a-button>
        </a-space>
      </a-col>
    </a-row>

    <!-- 端口转发表格 -->
    <a-table v-if="kind === 'port'" row-key="key" :data="portRows" :pagination="false" :bordered="false" :row-selection="{ type: 'checkbox', showCheckedAll: true }"
             v-model:selected-keys="selected" :row-class="r => (r.group ? 'grp-row' : '')" :span-method="spanMethod" v-model:expanded-keys="expanded" :indent-size="0" :scroll="{ x: 1250 }">
      <template #columns>
        <a-table-column title="状态" :width="110"><template #cell="{ record }"><GroupHead v-if="record.group" :g="record" /><Status v-else :r="record" /></template></a-table-column>
        <a-table-column title="节点" :width="90"><template #cell="{ record }">{{ record.group ? '' : nodeOf(record.node).name }}</template></a-table-column>
        <a-table-column title="规则备注" :width="130"><template #cell="{ record }">{{ record.group ? '' : record.remark || '-' }}</template></a-table-column>
        <a-table-column title="转发入口" :width="190"><template #cell="{ record }"><span v-if="!record.group" class="mono">{{ nodeOf(record.node).ip }}:{{ record.port }}</span></template></a-table-column>
        <a-table-column title="转发出口" :width="200"><template #cell="{ record }"><div v-if="!record.group" class="lines"><div class="mono">{{ vmOf(record.vm).ip }}:{{ record.tport }}</div><div class="muted">{{ vmOf(record.vm).vmid }} {{ vmOf(record.vm).name }}</div></div></template></a-table-column>
        <a-table-column title="协议" :width="90"><template #cell="{ record }"><a-tag v-if="!record.group" size="small">{{ record.proto }}</a-tag></template></a-table-column>
        <a-table-column title="流量（24h）" :width="140"><template #cell="{ record }"><div v-if="!record.group" class="updown"><div class="u"><icon-upload /> {{ fmt(record.up) }}</div><div class="d"><icon-download /> {{ fmt(record.down) }}</div></div></template></a-table-column>
        <a-table-column title="连接" :width="60"><template #cell="{ record }">{{ record.group ? '' : record.conn }}</template></a-table-column>
        <a-table-column title="启用" :width="70"><template #cell="{ record }"><a-switch v-if="!record.group" v-model="record.enabled" size="small" /></template></a-table-column>
        <a-table-column title="操作" :width="120" fixed="right"><template #cell="{ record }"><a-space v-if="!record.group" :size="0">
          <a-button type="text" size="small" @click="openForm(record, 'port')">编辑</a-button>
          <a-popconfirm content="删除后该端口立即停止转发，确定删除？" type="warning" @ok="remove(record)"><a-button type="text" size="small" status="danger">删除</a-button></a-popconfirm></a-space></template></a-table-column>
      </template>
    </a-table>

    <!-- Web 转发表格 -->
    <a-table v-else row-key="key" :data="webRows" :pagination="false" :bordered="false" :row-selection="{ type: 'checkbox', showCheckedAll: true }"
             v-model:selected-keys="selected" :row-class="r => (r.group ? 'grp-row' : '')" :span-method="spanMethod" v-model:expanded-keys="expanded" :indent-size="0" :scroll="{ x: 1250 }">
      <template #columns>
        <a-table-column title="状态" :width="110"><template #cell="{ record }"><GroupHead v-if="record.group" :g="record" /><Status v-else :r="record" /></template></a-table-column>
        <a-table-column title="节点" :width="90"><template #cell="{ record }">{{ record.group ? '' : nodeOf(record.node).name }}</template></a-table-column>
        <a-table-column title="域名" :width="270"><template #cell="{ record }"><div v-if="!record.group" class="domain-list lines">
          <div v-for="d in record.domains" :key="d.sub + d.root"><a href="#" @click.prevent>{{ url(record, d) }}</a></div>
          <div v-if="record.remark" class="muted">{{ record.remark }}</div></div></template></a-table-column>
        <a-table-column title="入口" :width="110"><template #cell="{ record }"><a-tag v-if="!record.group" size="small" :color="isHttps(record.port) ? 'green' : 'arcoblue'">{{ portLabel(record.port) }}</a-tag></template></a-table-column>
        <a-table-column title="转发到" :width="200"><template #cell="{ record }"><div v-if="!record.group" class="lines">
          <div class="mono">{{ record.scheme }}://{{ vmOf(record.vm).ip }}:{{ record.tport }}</div>
          <div class="muted">{{ vmOf(record.vm).vmid }} {{ vmOf(record.vm).name }}</div></div></template></a-table-column>
        <a-table-column title="证书" :width="170"><template #cell="{ record }"><template v-if="!record.group">
          <span v-if="!record.cert" class="muted">无（HTTP）</span>
          <div v-else class="lines"><div><icon-safe style="color:rgb(var(--green-6))" /> {{ certOf(record.cert).name }}</div>
            <div class="muted" :style="{ color: expColor(certOf(record.cert).days) }">{{ certOf(record.cert).days }} 天后到期</div></div></template></template></a-table-column>
        <a-table-column title="请求 / 流量（24h）" :width="160"><template #cell="{ record }"><div v-if="!record.group" class="lines">
          <div>{{ record.req.toLocaleString() }} 次</div><div class="updown"><span class="u"><icon-upload /> {{ fmt(record.up) }}</span>&nbsp;&nbsp;<span class="d"><icon-download /> {{ fmt(record.down) }}</span></div></div></template></a-table-column>
        <a-table-column title="启用" :width="70"><template #cell="{ record }"><a-switch v-if="!record.group" v-model="record.enabled" size="small" /></template></a-table-column>
        <a-table-column title="操作" :width="120" fixed="right"><template #cell="{ record }"><a-space v-if="!record.group" :size="0">
          <a-button type="text" size="small" @click="openForm(record, 'web')">编辑</a-button>
          <a-popconfirm content="删除后该域名立即停止转发，并删除自动添加的 DNS 解析，确定删除？" type="warning" @ok="remove(record)"><a-button type="text" size="small" status="danger">删除</a-button></a-popconfirm></a-space></template></a-table-column>
      </template>
    </a-table>
  </a-card>
</div>

<!-- ============================================================ Web 转发设置（管理员） -->
<div v-else-if="page === 'webset'" class="container">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>转发管理</a-breadcrumb-item><a-breadcrumb-item>Web 转发设置</a-breadcrumb-item></a-breadcrumb>
  <a-card class="general-card">
    <a-tabs v-model:active-key="setTab">
      <!-- 主域名 -->
      <a-tab-pane key="domains" title="主域名">
        <a-row justify="space-between" style="margin-bottom:16px">
          <span class="muted">用户只能使用这里的主域名，填写前缀即可（如 dev-zcy + .weincloud.com）。保存站点后，系统通过所选 DNS 服务商自动添加解析，指向节点公网 IP</span>
          <a-button type="primary" @click="openDomain()"><template #icon><icon-plus /></template>添加主域名</a-button>
        </a-row>
        <a-table :data="roots" :pagination="false" :bordered="false" row-key="id">
          <template #columns>
            <a-table-column title="主域名" :width="200"><template #cell="{ record }"><b class="mono" style="font-size:13px">{{ record.name }}</b></template></a-table-column>
            <a-table-column title="DNS 服务商" :width="220"><template #cell="{ record }"><span class="provider-type"><i :style="{ background: typeColor[providerOf(record.provider).type] }"></i>{{ providerOf(record.provider).name }}</span>
              <div class="muted">{{ typeName[providerOf(record.provider).type] }}</div></template></a-table-column>
            <a-table-column title="可用用户" :width="160"><template #cell="{ record }">{{ record.who === 'all' ? '全部用户' : record.users.join('、') }}</template></a-table-column>
            <a-table-column title="可用证书" :width="200"><template #cell="{ record }"><span v-if="certsFor(record.name).length">{{ certsFor(record.name).map(c => c.name).join('、') }}</span><span v-else class="muted">无（只能用 HTTP 入口）</span></template></a-table-column>
            <a-table-column title="已用" :width="90"><template #cell="{ record }">{{ sites.filter(s => s.domains.some(d => d.root === record.id)).length }} 个站点</template></a-table-column>
            <a-table-column title="操作" :width="120"><template #cell="{ record }"><a-space :size="0"><a-button type="text" size="small" @click="openDomain(record)">编辑</a-button>
              <a-popconfirm content="删除后不能再用该主域名添加站点（已有站点不受影响），确定删除？" type="warning" @ok="roots.splice(roots.indexOf(record), 1)"><a-button type="text" size="small" status="danger">删除</a-button></a-popconfirm></a-space></template></a-table-column>
          </template>
        </a-table>
      </a-tab-pane>

      <!-- DNS 服务商 -->
      <a-tab-pane key="dns" title="DNS 服务商">
        <a-row justify="space-between" style="margin-bottom:16px">
          <span class="muted">同一类服务商可添加多个账号；密钥在控制端加密保存，保存后不可查看</span>
          <a-button type="primary" @click="openProvider()"><template #icon><icon-plus /></template>添加 DNS 服务商</a-button>
        </a-row>
        <a-table :data="providers" :pagination="false" :bordered="false" row-key="id">
          <template #columns>
            <a-table-column title="名称" :width="200"><template #cell="{ record }"><span class="provider-type"><i :style="{ background: typeColor[record.type] }"></i>{{ record.name }}</span></template></a-table-column>
            <a-table-column title="类型" :width="140"><template #cell="{ record }">{{ typeName[record.type] }}</template></a-table-column>
            <a-table-column title="账号" :width="220"><template #cell="{ record }"><span class="mono">{{ record.key }}</span></template></a-table-column>
            <a-table-column title="状态" :width="140"><template #cell="{ record }"><span><span class="circle" :class="record.ok ? 'pass' : 'err'"></span>{{ record.ok ? '验证通过' : '密钥无效' }}</span></template></a-table-column>
            <a-table-column title="使用的主域名"><template #cell="{ record }">{{ roots.filter(r => r.provider === record.id).map(r => r.name).join('、') || '-' }}</template></a-table-column>
            <a-table-column title="操作" :width="170"><template #cell="{ record }"><a-space :size="0"><a-button type="text" size="small" @click="testProvider(record)">测试</a-button><a-button type="text" size="small" @click="openProvider(record)">编辑</a-button>
              <a-popconfirm :content="roots.some(r => r.provider === record.id) ? '有主域名正在使用，无法删除' : '确定删除？'" type="warning" @ok="!roots.some(r => r.provider === record.id) && providers.splice(providers.indexOf(record), 1)">
                <a-button type="text" size="small" status="danger" :disabled="roots.some(r => r.provider === record.id)">删除</a-button></a-popconfirm></a-space></template></a-table-column>
          </template>
        </a-table>
      </a-tab-pane>

      <!-- 证书 -->
      <a-tab-pane key="certs" title="证书">
        <a-row justify="space-between" style="margin-bottom:16px">
          <span class="muted">由管理员手动添加；用户添加 HTTPS 站点时，只能选择覆盖其域名的证书。证书到期前 30 天会在事件通知中提醒</span>
          <a-button type="primary" @click="openCert()"><template #icon><icon-plus /></template>添加证书</a-button>
        </a-row>
        <a-table :data="certs" :pagination="false" :bordered="false" row-key="id">
          <template #columns>
            <a-table-column title="名称" :width="180" data-index="name" />
            <a-table-column title="包含域名" :width="260"><template #cell="{ record }"><div class="lines mono"><div v-for="d in record.domains" :key="d">{{ d }}</div></div></template></a-table-column>
            <a-table-column title="颁发者" :width="150" data-index="issuer" />
            <a-table-column title="到期时间" :width="170"><template #cell="{ record }"><div class="lines"><div>{{ record.expire }}</div>
              <div class="muted" :style="{ color: expColor(record.days) }">{{ record.days }} 天后到期</div></div></template></a-table-column>
            <a-table-column title="使用站点" :width="100"><template #cell="{ record }">{{ sites.filter(s => s.cert === record.id).length }} 个</template></a-table-column>
            <a-table-column title="操作" :width="140"><template #cell="{ record }"><a-space :size="0"><a-button type="text" size="small" @click="openCert(record)">编辑</a-button>
              <a-popconfirm :content="sites.some(s => s.cert === record.id) ? '有站点正在使用，无法删除' : '确定删除？'" type="warning" @ok="!sites.some(s => s.cert === record.id) && certs.splice(certs.indexOf(record), 1)">
                <a-button type="text" size="small" status="danger" :disabled="sites.some(s => s.cert === record.id)">删除</a-button></a-popconfirm></a-space></template></a-table-column>
          </template>
        </a-table>
      </a-tab-pane>

      <!-- Web 入口 -->
      <a-tab-pane key="entry" title="Web 入口">
        <a-space direction="vertical" :size="16" fill>
          <div v-for="n in nodes" :key="n.id" style="border:1px solid var(--color-border-2);border-radius:4px;padding:16px 20px">
            <a-row justify="space-between" align="center" style="margin-bottom:16px">
              <a-space><b>{{ n.name }}</b><span class="muted mono">{{ n.ip }}</span>
                <a-badge v-if="n.web.enabled && n.web.ver" status="success" :text="`OpenResty 运行中 · v${n.web.ver} · ${n.web.runAt}`" /></a-space>
              <a-space><span class="muted">启用 Web 转发</span><a-switch v-model="n.web.enabled" /></a-space>
            </a-row>
            <template v-if="n.web.enabled">
              <a-form :model="n.web" layout="vertical">
                <a-form-item label="运行方式">
                  <a-radio-group v-model="n.web.mode" class="mode-cards">
                    <a-radio value="host"><div class="t">宿主机运行</div>
                      <div class="d">OpenResty 安装在 PVE 宿主机上，直接监听 Web 端口。部署简单，不占用虚拟机；会在宿主机安装软件。</div></a-radio>
                    <a-radio value="vm"><div class="t">指定虚拟机运行</div>
                      <div class="d">宿主机只把 Web 端口转发到指定虚拟机，OpenResty 在该虚拟机内转发到其他虚拟机。宿主机不装软件，与宿主机隔离。</div></a-radio>
                  </a-radio-group>
                </a-form-item>
              </a-form>
              <div class="flow" style="margin-bottom:16px">
                <div class="box">客户端<div class="muted">http(s)://子域名.主域名</div></div><span class="arrow">→</span>
                <template v-if="n.web.mode === 'host'">
                  <div class="box hl">{{ n.name }} {{ n.ip }}<div class="muted">宿主机 OpenResty 按域名分流</div></div><span class="arrow">→</span>
                </template>
                <template v-else>
                  <div class="box">{{ n.name }} {{ n.ip }}<div class="muted">nftables 转发 Web 端口</div></div><span class="arrow">→</span>
                  <div class="box hl">{{ n.web.vm ? `${vmOf(n.web.vm).vmid} ${vmOf(n.web.vm).name} ${vmOf(n.web.vm).ip}` : '入口虚拟机' }}<div class="muted">虚拟机内 OpenResty 按域名分流</div></div><span class="arrow">→</span>
                </template>
                <div class="box">目标虚拟机内网 IP:端口</div>
              </div>
              <a-form v-if="n.web.mode === 'vm'" :model="n.web" layout="vertical">
                <a-row :gutter="40">
                  <a-col :xs="24" :md="8"><a-form-item label="入口虚拟机" required extra="需要能访问同一内网的其他虚拟机">
                    <a-select v-model="n.web.vm" placeholder="选择虚拟机" @change="n.web.checks = null">
                      <a-option v-for="v in vms.filter(v => v.node === n.id)" :key="v.id" :value="v.id" :label="`${v.vmid} ${v.name}（${v.ip}）`" />
                    </a-select></a-form-item></a-col>
                  <a-col :xs="24" :md="8"><a-form-item label="部署方式">
                    <a-radio-group v-model="n.web.deploy"><a-radio value="auto">自动安装</a-radio><a-radio value="manual">已自行安装</a-radio></a-radio-group>
                    <template #extra>{{ n.web.deploy === 'auto' ? '通过 SSH 安装 OpenResty 并下发配置' : '只通过 SSH 下发配置并执行 openresty -s reload' }}</template></a-form-item></a-col>
                  <a-col :xs="24" :md="8"><a-form-item label="SSH 连接" :extra="`经由节点 ${n.name} 跳转连接，虚拟机 SSH 不需要对外开放`">
                    <a-input-group style="width:100%"><a-input v-model="n.web.sshUser" style="width:90px" /><a-input-number v-model="n.web.sshPort" :min="1" :max="65535" style="width:90px"><template #prefix>:</template></a-input-number>
                      <a-select v-model="n.web.sshAuth" style="flex:1" :options="[{ label: '使用节点密钥', value: 'node' }, { label: '密码', value: 'pwd' }, { label: '私钥', value: 'key' }]" /></a-input-group></a-form-item></a-col>
                </a-row>
                <a-row v-if="n.web.sshAuth !== 'node'" :gutter="40"><a-col :xs="24" :md="8">
                  <a-form-item :label="n.web.sshAuth === 'pwd' ? 'SSH 密码' : 'SSH 私钥'"><a-input-password v-if="n.web.sshAuth === 'pwd'" placeholder="加密保存" /><a-textarea v-else class="mono" spellcheck="false" :auto-size="{ minRows: 2, maxRows: 4 }" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----" /></a-form-item></a-col></a-row>
                <a-form-item label="环境检测">
                  <div style="width:100%">
                    <a-button size="small" :disabled="!n.web.vm" :loading="n.web.checking" @click="checkVM(n)"><template #icon><icon-check-circle /></template>检测虚拟机</a-button>
                    <div v-if="n.web.checks" class="checks" style="margin-top:8px">
                      <div v-for="c in n.web.checks" :key="c.t" :class="c.ok ? 'ok' : 'no'"><icon-check-circle-fill v-if="c.ok" /><icon-close-circle-fill v-else /> {{ c.t }}<span v-if="c.d" class="muted" style="margin-left:6px">{{ c.d }}</span></div>
                    </div>
                  </div>
                </a-form-item>
                <a-alert type="info" style="margin-bottom:16px">入口虚拟机停止时，该节点的全部 Web 转发都会中断，建议使用开机自启、不常重启的虚拟机。客户端真实 IP 通过 X-Forwarded-For / X-Real-IP 传给目标虚拟机。</a-alert>
              </a-form>
              <a-form :model="n.web" layout="vertical">
                <a-row :gutter="40">
                  <a-col :xs="24" :md="8"><a-form-item label="HTTP 端口"><a-input-tag v-model="n.web.httpText" @change="v => (n.web.http = v.map(Number))" /></a-form-item></a-col>
                  <a-col :xs="24" :md="8"><a-form-item label="HTTPS 端口"><a-input-tag v-model="n.web.httpsText" @change="v => (n.web.https = v.map(Number))" /></a-form-item></a-col>
                  <a-col :xs="24" :md="8"><a-form-item label="默认入口端口"><a-select v-model="n.web.def" :options="[...n.web.http, ...n.web.https].sort((a, b) => a - b).map(p => ({ label: portLabel(p), value: p }))" /></a-form-item></a-col>
                </a-row>
              </a-form>
              <a-alert v-for="c in conflicts(n)" :key="c.port" type="warning" style="margin-bottom:8px" :title="`端口 ${c.port} 正被端口转发规则「${c.remark}」使用`">
                同一端口只能由一种方式使用：由 Web 转发接管（删除该端口转发规则），或从 Web 端口中移除 {{ c.port }}。
                <template #action><a-space><a-button size="mini" type="primary" @click="takeOver(c)">由 Web 转发接管</a-button><a-button size="mini" @click="dropPort(n, c.port)">移除此端口</a-button></a-space></template>
              </a-alert>
              <a-row justify="space-between" align="center">
                <span class="muted">Web 端口自动加入该节点的保留端口，不能再分配给用户做端口转发。</span>
                <a-button type="primary" :disabled="n.web.mode === 'vm' && !n.web.vm" @click="deployWeb(n)">保存并部署</a-button>
              </a-row>
            </template>
            <span v-else class="muted">未启用：该节点上不能添加 Web 转发</span>
          </div>
        </a-space>
      </a-tab-pane>
    </a-tabs>
  </a-card>
</div>

<div v-else class="container" style="padding-top:60px">
  <a-result status="info" title="原型只包含转发相关页面" subtitle="请点击左侧「转发管理 → 转发规则」或「Web 转发设置」" />
</div>

      </a-layout-content>
    </a-layout>
  </a-layout>

  <!-- ============================================================ 添加 / 编辑规则 -->
  <a-modal v-model:visible="formVisible" :title="f.id ? '编辑规则' : '添加规则'" :width="720" @before-ok="save" unmount-on-close :ok-button-props="{ disabled: !canSave }">
    <a-tabs v-model:active-key="formKind" class="form-tabs" :editable="false">
      <a-tab-pane key="web" :disabled="!!f.id && formKind !== 'web'"><template #title><icon-public /> Web 转发</template></a-tab-pane>
      <a-tab-pane key="port" :disabled="!!f.id && formKind !== 'port'"><template #title><icon-swap /> 端口转发</template></a-tab-pane>
    </a-tabs>
    <a-form :model="f" :label-col-props="{ span: 5 }" :wrapper-col-props="{ span: 19 }">
      <a-form-item label="所属用户" :extra="isAdmin ? (f.owner === '公共' ? '公共规则只有管理员可以管理，可指向任意虚拟机' : undefined) : '规则只能创建在自己名下'">
        <a-select v-model="f.owner" :disabled="!isAdmin" :options="(isAdmin ? ['公共', ...users] : [me]).map(u => ({ label: u === '公共' ? '公共（管理员）' : u, value: u }))" @change="f.vm = undefined" /></a-form-item>
      <a-form-item label="节点"><a-select v-model="f.node" :options="nodes.filter(n => formKind === 'port' || n.web.enabled).map(n => ({ label: `${n.name}（${n.ip}）`, value: n.id }))" /></a-form-item>

      <!-- 端口转发 -->
      <template v-if="formKind === 'port'">
        <a-form-item label="监听端口" required extra="只能从管理员分配的端口中选择">
          <a-select v-model="f.port" placeholder="请选择或输入端口搜索" allow-search :options="[33001, 33002, 33003, 33004, 33005].map(p => ({ label: String(p), value: p }))" /></a-form-item>
        <a-form-item label="协议"><a-radio-group v-model="f.proto"><a-radio value="TCP">TCP</a-radio><a-radio value="UDP">UDP</a-radio><a-radio value="TCP + UDP">TCP + UDP</a-radio></a-radio-group></a-form-item>
      </template>

      <!-- Web 转发 -->
      <template v-else>
        <a-form-item label="域名" required extra="填写子域名前缀并选择主域名；保存后自动添加 DNS 解析，指向节点公网 IP">
          <div style="width:100%">
            <template v-for="(d, i) in f.domains" :key="i">
              <div class="domain-row">
                <a-input-group>
                  <a-input v-model="d.sub" placeholder="如 dev-zcy" style="flex:1" allow-clear :error="['bad', 'taken', 'dup'].includes(d.st)" />
                  <a-select v-model="d.root" style="width:200px" :options="rootOptions" placeholder="选择主域名" :error="!!d.sub && !d.root" />
                </a-input-group>
                <a-button v-if="f.domains.length > 1" shape="circle" size="small" @click="f.domains.splice(i, 1)"><template #icon><icon-minus /></template></a-button>
              </div>
              <div v-if="d.st" class="domain-st" :class="{ ok: d.st === 'ok', bad: ['bad', 'taken', 'dup'].includes(d.st), wait: d.st === 'checking' }">
                <template v-if="d.st === 'checking'"><icon-loading /> 正在查询 {{ host(d) }} 的解析…</template>
                <template v-else-if="d.st === 'ok'"><icon-check-circle-fill /> {{ d.msg }}</template>
                <template v-else-if="d.st"><icon-close-circle-fill /> {{ d.msg }}</template>
              </div>
            </template>
            <a-link style="font-size:12px" @click="f.domains.push({ sub: '', root: rootOptions[0]?.value })"><icon-plus /> 添加域名</a-link>
          </div>
        </a-form-item>
        <a-form-item label="入口端口" required :extra="`访问地址：${f.domains[0]?.sub ? url(f, f.domains[0]) : 'http(s)://子域名.主域名'}`">
          <a-radio-group v-model="f.port" class="entry-port" @change="onPortChange">
            <a-radio v-for="p in entryPorts" :key="p" :value="p">
              <div class="pt">{{ portLabel(p) }}</div><span v-if="p === nodeOf(f.node).web.def" class="def">默认</span>
              <div class="muted">{{ isHttps(p) ? '需要证书' : p === 80 ? '直接访问' : '需带端口访问' }}</div>
            </a-radio>
          </a-radio-group>
        </a-form-item>
        <a-form-item v-if="isHttps(f.port)" label="证书" required :extra="certChoices.length ? '只列出覆盖所填域名的证书' : undefined">
          <a-select v-model="f.cert" placeholder="选择证书" :options="certChoices.map(c => ({ label: `${c.name}（${c.domains.join('、')} · ${c.days} 天后到期）`, value: c.id }))">
            <template #empty><div style="padding:12px;text-align:center" class="muted">没有覆盖所填域名的证书，请联系管理员添加，或改用 HTTP 入口</div></template>
          </a-select>
        </a-form-item>
      </template>

      <a-form-item :label="formKind === 'port' ? '目标虚拟机' : '转发到'" required :extra="f.owner === '公共' ? '节点上的全部虚拟机' : '只能选择自己的虚拟机或公共虚拟机'">
        <a-input-group style="width:100%">
          <a-select v-if="formKind === 'web'" v-model="f.scheme" style="width:100px" :options="['http', 'https']" />
          <a-select v-model="f.vm" placeholder="选择虚拟机" style="flex:1" allow-search>
            <a-option v-for="v in vmOptions" :key="v.id" :value="v.id" :label="`${v.vmid} ${v.name}（${v.ip}）`">
              <div style="display:flex;justify-content:space-between;gap:12px"><span><span class="mono">{{ v.vmid }}</span> {{ v.name }}<a-tag v-if="v.shared" size="small" style="margin-left:4px">公共</a-tag></span><span class="mono muted">{{ v.ip }}</span></div></a-option>
          </a-select>
          <a-input-number v-model="f.tport" :min="1" :max="65535" style="width:130px" placeholder="端口"><template #prefix>:</template></a-input-number>
        </a-input-group>
      </a-form-item>
      <a-form-item label="备注"><a-input v-model="f.remark" :max-length="40" show-word-limit placeholder="选填" /></a-form-item>

      <!-- 高级参数（Web 转发，默认折叠） -->
      <template v-if="formKind === 'web'">
        <div class="adv-toggle" @click="adv = !adv">高级参数 <icon-down :style="{ transform: adv ? 'rotate(180deg)' : 'none', transition: 'transform .2s' }" /></div>
        <template v-if="adv">
          <a-form-item label="选项">
            <a-space direction="vertical" :size="6">
              <a-checkbox v-model="f.ws">支持 WebSocket</a-checkbox>
              <a-checkbox v-model="f.realIp">传递真实客户端 IP（X-Forwarded-For / X-Real-IP）</a-checkbox>
              <a-checkbox v-model="f.block">拦截常见攻击（SQL 注入、路径穿越等）</a-checkbox>
              <a-checkbox v-model="f.cache">缓存静态资源</a-checkbox>
              <a-checkbox v-if="isHttps(f.port)" v-model="f.forceHttps">HTTP 自动跳转 HTTPS</a-checkbox>
            </a-space>
          </a-form-item>
          <a-form-item label="访问密码" extra="浏览器弹出登录框（HTTP Basic Auth）"><a-space><a-switch v-model="f.auth" /><template v-if="f.auth"><a-input v-model="f.authUser" placeholder="用户名" style="width:140px" /><a-input-password placeholder="密码" style="width:160px" /></template></a-space></a-form-item>
          <a-form-item label="上传大小上限"><a-input-number v-model="f.bodyMax" :min="1" style="width:160px"><template #append>MB</template></a-input-number></a-form-item>
          <a-form-item label="超时"><a-input-number v-model="f.timeout" :min="5" style="width:160px"><template #append>秒</template></a-input-number></a-form-item>
          <a-form-item label="自定义请求头"><a-textarea v-model="f.headers" class="mono" spellcheck="false" :auto-size="{ minRows: 2, maxRows: 4 }" placeholder="X-From: pve-forward" /></a-form-item>
          <a-form-item v-if="isAdmin" label="自定义配置" extra="仅管理员可见，原样写入 server 块；下发前执行 openresty -t 校验">
            <a-textarea v-model="f.custom" class="mono" spellcheck="false" :auto-size="{ minRows: 3, maxRows: 6 }" placeholder="location /api/ { ... }" /></a-form-item>
        </template>
      </template>
    </a-form>
  </a-modal>

  <!-- 主域名 -->
  <a-modal v-model:visible="domainVisible" :title="df.id ? '编辑主域名' : '添加主域名'" :width="560" @ok="saveDomain">
    <a-form :model="df" :label-col-props="{ span: 6 }" :wrapper-col-props="{ span: 18 }">
      <a-form-item label="主域名" required extra="如 weincloud.com；用户填写前缀，组成 前缀.weincloud.com"><a-input v-model="df.name" placeholder="example.com" /></a-form-item>
      <a-form-item label="DNS 服务商" required extra="用户保存站点后，用该账号自动添加 A 记录">
        <a-select v-model="df.provider" :options="providers.map(p => ({ label: `${p.name}（${typeName[p.type]}）`, value: p.id }))" /></a-form-item>
      <a-form-item label="可用用户">
        <div style="width:100%"><a-radio-group v-model="df.who"><a-radio value="all">全部用户</a-radio><a-radio value="some">指定用户</a-radio></a-radio-group>
          <a-select v-if="df.who === 'some'" v-model="df.users" multiple style="margin-top:8px" :options="users.map(u => ({ label: u, value: u }))" /></div></a-form-item>
    </a-form>
  </a-modal>

  <!-- DNS 服务商 -->
  <a-modal v-model:visible="providerVisible" :title="pf.id ? '编辑 DNS 服务商' : '添加 DNS 服务商'" :width="560" @ok="saveProvider">
    <a-form :model="pf" :label-col-props="{ span: 6 }" :wrapper-col-props="{ span: 18 }">
      <a-form-item label="类型"><a-select v-model="pf.type" :disabled="!!pf.id" :options="Object.keys(typeName).map(k => ({ label: typeName[k], value: k }))" /></a-form-item>
      <a-form-item label="名称" required><a-input v-model="pf.name" placeholder="例如 公司 DNSPod 账号" /></a-form-item>
      <a-form-item v-for="fd in typeFields[pf.type]" :key="fd.k" :label="fd.label" required :extra="fd.extra">
        <a-input-password v-if="fd.secret" v-model="pf.fields[fd.k]" :placeholder="pf.id ? '已保存，留空则不修改' : ''" />
        <a-input v-else v-model="pf.fields[fd.k]" :placeholder="fd.ph" />
      </a-form-item>
      <a-form-item><a-button @click="ArcoVue.Message.success('连接成功，账号下共 6 个域名')">测试连接</a-button></a-form-item>
    </a-form>
  </a-modal>

  <!-- 证书 -->
  <a-modal v-model:visible="certVisible" :title="cf.id ? '编辑证书' : '添加证书'" :width="640" @before-ok="saveCert">
    <a-form :model="cf" layout="vertical">
      <a-form-item label="名称" required><a-input v-model="cf.name" placeholder="例如 weincloud 通配符证书" /></a-form-item>
      <a-form-item label="证书（PEM，含中间证书）" required extra="从本地 .pem / .crt / .cer 文件读取内容（不会上传文件），或直接粘贴">
        <div style="width:100%">
          <div class="pem-upload"><label><input type="file" hidden accept=".pem,.crt,.cer" @change="e => readPem(e, 'cert')" />
            <a-button size="small" @click="e => e.currentTarget.previousElementSibling.click()"><template #icon><icon-file /></template>读取证书文件</a-button></label>
            <span v-if="cf.certFile" class="muted" style="margin-left:8px">已读取 {{ cf.certFile }}</span></div>
          <a-textarea v-model="cf.cert" class="mono" spellcheck="false" :auto-size="{ minRows: 5, maxRows: 8 }" placeholder="-----BEGIN CERTIFICATE-----" />
        </div>
      </a-form-item>
      <a-form-item label="私钥（PEM）" required extra="从本地 .key / .pem 文件读取内容（不会上传文件），或直接粘贴；私钥加密保存，只有管理员能查看">
        <div style="width:100%">
          <div class="pem-upload"><label><input type="file" hidden accept=".key,.pem" @change="e => readPem(e, 'key')" />
            <a-button size="small" @click="e => e.currentTarget.previousElementSibling.click()"><template #icon><icon-file /></template>读取私钥文件</a-button></label>

      if (c) Object.assign(c, { name: cf.name, key: cf.key }, certChanged.value ? { ...certInfo.value, pem: cf.cert } : {});
      else certs.push({ id: Date.now(), name: cf.name, ...certInfo.value, pem: cf.cert, key: cf.key });
      ArcoVue.Message.success(!cf.id ? '已添加证书' : certChanged.value ? '已更换证书，使用它的站点已重新加载' : '已保存');
      done(true);
    };

    // ---------------- Web 入口 ----------------
    // 入口虚拟机检测（原型：模拟结果；waf、nginx 虚拟机上 80/443 已被占用）
    function checkVM(n) {
      n.web.checking = true;
      setTimeout(() => {
        const v = vmOf(n.web.vm), busy = v.name === 'nginx' || v.name === 'waf';
        const ports = [...n.web.http, ...n.web.https].sort((a, b) => a - b);
        n.web.checks = [
          { t: '虚拟机运行中', ok: true },
          { t: 'SSH 可连接', ok: true, d: `${n.web.sshUser}@${v.ip}:${n.web.sshPort}` },
          { t: '系统支持', ok: true, d: 'Debian 12 · x86_64' },
          { t: '可访问内网其他虚拟机', ok: true, d: '10.10.10.0/24' },
          { t: `端口 ${ports.join(' / ')} 未被占用`, ok: !busy, d: busy ? `80、443 已被 ${v.name === 'waf' ? 'safeline-tengine' : 'nginx'} 占用` : '' },
          { t: n.web.deploy === 'auto' ? '可安装 OpenResty' : '已安装 OpenResty', ok: true, d: n.web.deploy === 'auto' ? '官方 APT 源可访问' : 'openresty 1.25.3.2' },
        ];
        n.web.checking = false;
      }, 700);
    }
    function deployWeb(n) {
      if (n.web.mode === 'vm' && n.web.checks?.some(c => !c.ok)) { ArcoVue.Message.error('环境检测未通过，请处理后再部署'); return; }
      const where = n.web.mode === 'host' ? '宿主机' : `${vmOf(n.web.vm).vmid} ${vmOf(n.web.vm).name}`;
      const moved = n.web.ver && n.web.runAt !== where;
      n.web.ver = n.web.ver || '1.27.1.2';
      n.web.runAt = where;
      ArcoVue.Message.success(moved ? `已迁移到 ${where}：配置和证书已同步，Web 端口已切换，原位置的 OpenResty 已停止` : `已在 ${where} 部署 OpenResty 并下发 ${sites.filter(x => x.node === n.id).length} 个站点`);
    }
    const conflicts = n => portRules.filter(r => r.node === n.id && r.owner === '公共' && [...n.web.http, ...n.web.https].includes(r.port));
    const takeOver = c => { portRules.splice(portRules.indexOf(c), 1); ArcoVue.Message.success(`保存后删除端口转发规则「${c.remark}」，${c.port} 由 Web 转发接管`); };
    const dropPort = (n, p) => {
      n.web.http = n.web.http.filter(x => x !== p); n.web.https = n.web.https.filter(x => x !== p);
      n.web.httpText = n.web.http.map(String); n.web.httpsText = n.web.https.map(String);
      if (n.web.def === p) n.web.def = n.web.http[0] || n.web.https[0];
    };

    return { ArcoVue, page, role, isAdmin, me, kind, selected, nodes, nodeOf, webPorts, isHttps, portLabel, vms, vmOf, users, fmt,
      typeName, typeColor, typeFields, providers, providerOf, roots, rootOf, certs, certOf, certsFor, portRules, sites, url,
      visiblePorts, visibleSites, q, expanded, ownerOptions, portRows, webRows, spanMethod, batch, remove,
      formVisible, formKind, adv, f, err, rootOptions, entryPorts, vmOptions, certChoices, canSave, host, openForm, onPortChange, save,
      setTab, domainVisible, providerVisible, certVisible, df, pf, cf, openDomain, saveDomain, openProvider, saveProvider, testProvider, openCert, saveCert, readPem, expType, expColor, certChanged, certInfo,
      conflicts, takeOver, dropPort, checkVM, deployWeb };
  },
});
app.component('GroupHead', GroupHead);
app.component('Status', Status);
app.use(ArcoVue).use(ArcoVueIcon).mount('#app');
</script>
