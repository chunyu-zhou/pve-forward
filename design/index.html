  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>PVE 节点</a-breadcrumb-item><a-breadcrumb-item>添加节点</a-breadcrumb-item></a-breadcrumb>
  <a-card class="general-card">
    <template #title>添加节点<span v-if="nodeForm.name" class="muted" style="margin-left:8px">{{ nodeForm.name }}</span></template>
    <template #extra><span class="muted">网络配置由 Agent 或 SSH 检测并执行，完成前不会改动节点</span></template>
    <div class="step-wrapper" style="padding:40px 0 48px">
      <a-steps :current="nodeStep" style="width: 940px" line-less class="steps">
        <a-step description="名称与连接方式">节点信息</a-step>
        <a-step :description="nodeForm.mode === 'ssh' ? '测试 SSH 连接' : '在 PVE 上安装 Agent'">建立连接</a-step>
        <a-step description="公网网口与地址">公网网络</a-step>
        <a-step description="网桥与 DHCP">内网与 DHCP</a-step>
        <a-step description="检查并应用">确认</a-step>
      </a-steps>

      <!-- 1. 节点信息与连接方式 -->
      <a-form v-if="nodeStep === 1" :model="nodeForm" class="step-form" style="width:640px" :label-col-props="{ span: 5 }" :wrapper-col-props="{ span: 19 }">
        <a-form-item label="节点名称" required :validate-status="nodeErr.name ? 'error' : undefined" :help="nodeErr.name || '用于界面展示，例如 pve-hk'">
          <a-input v-model="nodeForm.name" placeholder="pve-xx" /></a-form-item>
        <a-form-item label="备注"><a-input v-model="nodeForm.remark" placeholder="地域、机房等，选填" /></a-form-item>
        <a-form-item label="连接方式">
          <a-radio-group v-model="nodeForm.mode" direction="vertical" style="width:100%">
            <a-radio value="agent" class="nic-radio"><div class="nic-item"><b>Agent（WSS）</b><a-tag size="small" color="green">推荐</a-tag>
              <span class="muted">在 PVE 上安装 Agent，主动连接控制端；PVE 无需开放端口，适合内网 / NAT</span></div></a-radio>
            <a-radio value="ssh" class="nic-radio"><div class="nic-item"><b>SSH</b>
              <span class="muted">控制端通过 SSH 管理，PVE 无需安装程序；需能从控制端访问 PVE 的 SSH 端口</span></div></a-radio>
          </a-radio-group>
        </a-form-item>
        <template v-if="nodeForm.mode === 'ssh'">
          <a-form-item label="SSH 地址" required :validate-status="nodeErr.host ? 'error' : undefined" :help="nodeErr.host">
            <a-input-group style="width:100%"><a-input v-model="nodeForm.sshHost" placeholder="IP 或域名" style="width:75%" /><a-input-number v-model="nodeForm.sshPort" :min="1" :max="65535" style="width:25%" /></a-input-group></a-form-item>
          <a-form-item label="认证方式">
            <a-radio-group v-model="nodeForm.auth" type="button"><a-radio value="password">密码</a-radio><a-radio value="key">密钥</a-radio><a-radio value="cred">已保存凭证</a-radio></a-radio-group></a-form-item>
          <a-form-item v-if="nodeForm.auth === 'cred'" label="凭证" required :validate-status="nodeErr.cred ? 'error' : undefined" :help="nodeErr.cred">
            <a-select v-model="nodeForm.credId" placeholder="选择凭证">
              <a-option v-for="c in creds" :key="c.id" :value="c.id" :label="c.name"><div class="ip-opt"><span>{{ c.name }}</span><span class="muted">{{ c.user }} · {{ c.type === 'key' ? '密钥' : '密码' }}</span></div></a-option>
            </a-select>
            <template #extra><a-link @click="openCred()">新建凭证</a-link></template>
          </a-form-item>
          <template v-else>
            <a-form-item label="用户名"><a-input v-model="nodeForm.sshUser" /></a-form-item>
            <a-form-item v-if="nodeForm.auth === 'password'" label="密码" required :validate-status="nodeErr.secret ? 'error' : undefined" :help="nodeErr.secret">
              <a-input-password v-model="nodeForm.sshPwd" /></a-form-item>
            <template v-else>
              <a-form-item label="私钥" required :validate-status="nodeErr.secret ? 'error' : undefined" :help="nodeErr.secret || '支持 OpenSSH / PEM 格式，可粘贴或上传'">
                <a-textarea v-model="nodeForm.sshKey" :auto-size="{ minRows: 3, maxRows: 6 }" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----" class="mono" /></a-form-item>
              <a-form-item label="私钥口令"><a-input-password v-model="nodeForm.sshPass" placeholder="无口令可留空" /></a-form-item>
            </template>
            <a-form-item label=" "><a-checkbox v-model="nodeForm.saveCred">保存为凭证，供其他节点复用</a-checkbox>
              <a-input v-if="nodeForm.saveCred" v-model="nodeForm.credName" size="small" placeholder="凭证名称" style="width:200px;margin-left:12px" /></a-form-item>
          </template>
        </template>
        <a-form-item><a-button type="primary" @click="nodeNext">{{ nodeForm.mode === 'agent' ? '生成安装命令' : '测试连接' }}</a-button></a-form-item>
      </a-form>

      <!-- 2a. 建立连接：SSH -->
      <div v-else-if="nodeStep === 2 && nodeForm.mode === 'ssh'" class="step-form" style="width:760px">
        <a-descriptions :column="3" size="small" :data="[
          { label: '地址', value: nodeForm.sshHost + ':' + nodeForm.sshPort },
          { label: '用户', value: nodeForm.auth === 'cred' ? credOf(nodeForm.credId).user : nodeForm.sshUser },
          { label: '认证', value: nodeForm.auth === 'cred' ? '凭证 · ' + credOf(nodeForm.credId).name : nodeForm.auth === 'key' ? '密钥' : '密码' } ]" />
        <a-steps direction="vertical" :current="sshCheck.idx + 1" small style="margin:20px 0 0 0">
          <a-step v-for="(t, i) in sshTasks" :key="t.title" :status="sshCheck.idx > i ? 'finish' : sshCheck.idx === i ? (sshCheck.waitHostKey ? 'process' : 'process') : 'wait'" :description="sshCheck.idx > i ? t.ok : sshCheck.idx === i ? '进行中…' : ''">{{ t.title }}</a-step>
        </a-steps>
        <a-alert v-if="sshCheck.waitHostKey" type="warning" style="margin-top:12px">
          首次连接，请核对主机指纹：<span class="mono">SHA256:Jk2bQ8x1mV9p3cR7tYw4LzN0aHfE6uD5sG2iK8oP1qE</span>（ED25519）。可在 PVE 上执行 <span class="mono">ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub</span> 查看
          <template #action><a-button size="mini" type="primary" @click="trustHostKey">信任并继续</a-button></template>
        </a-alert>
        <div v-if="sshCheck.done" class="wait-box"><icon-check-circle-fill style="color:rgb(var(--green-6));font-size:24px" /><div style="flex:1">
          <div>SSH 连接成功</div>
          <a-descriptions :column="3" size="small" style="margin-top:6px" :data="[
            { label: '主机名', value: detect.hostname }, { label: 'PVE', value: detect.pve }, { label: '权限', value: 'root' },
            { label: '网口', value: detect.nics.length + ' 个' }, { label: '网桥', value: detect.bridges.length + ' 个' }, { label: '虚拟机', value: detect.vmCount + ' 台' } ]" /></div></div>
        <div style="text-align:center;margin-top:32px"><a-space>
          <a-button type="secondary" @click="nodeStep--">上一步</a-button>
          <a-button type="primary" :disabled="!sshCheck.done" @click="nodeNext">下一步：配置网络</a-button>
          <a-button type="text" @click="go('nodes')">稍后初始化</a-button></a-space></div>
      </div>

      <!-- 2b. 建立连接：Agent -->
      <div v-else-if="nodeStep === 2" class="step-form" style="width:760px">
        <div class="muted" style="margin-bottom:8px">在 <b>{{ nodeForm.name }}</b> 的 PVE 宿主机上以 root 执行：</div>
        <div class="cmd">{{ agentCmd(nodeForm.token) }}<a-button class="copy" size="mini" @click="copyCmd"><template #icon><icon-copy /></template>复制</a-button></div>
        <a-space direction="vertical" :size="4" style="margin-top:12px" class="muted">
          <span>· Agent 主动连接控制端 <span class="mono">{{ agentUrl }}</span>，PVE 无需开放入站端口</span>
          <span>· 接入令牌 30 分钟内有效、仅可使用一次；过期可重新生成</span>
          <span>· 安装过程不修改网络配置，网络在下一步由你确认后再应用</span>
        </a-space>
        <div class="wait-box">
          <template v-if="!agentConn.connected"><a-spin :size="20" /><div><div>等待 Agent 连接…</div><div class="muted">已等待 {{ agentConn.wait }} 秒</div></div>
            <a-space style="margin-left:auto"><a-button size="small" @click="regenToken">重新生成令牌</a-button><a-button size="small" type="outline" @click="mockConnect">模拟 Agent 已连接</a-button></a-space></template>
          <template v-else><icon-check-circle-fill style="color:rgb(var(--green-6));font-size:24px" /><div style="flex:1">
            <div>Agent 已连接</div>
            <a-descriptions :column="3" size="small" style="margin-top:6px" :data="[
              { label: '主机名', value: detect.hostname }, { label: 'PVE', value: detect.pve }, { label: 'Agent', value: '1.0.0' },
              { label: '网口', value: detect.nics.length + ' 个' }, { label: '网桥', value: detect.bridges.length + ' 个' }, { label: '虚拟机', value: detect.vmCount + ' 台' } ]" /></div></template>
        </div>
        <div style="text-align:center;margin-top:32px"><a-space>
          <a-button type="secondary" @click="nodeStep--">上一步</a-button>
          <a-button type="primary" :disabled="!agentConn.connected" @click="nodeNext">下一步：配置网络</a-button>
          <a-button type="text" @click="go('nodes')">稍后初始化</a-button></a-space></div>
      </div>

      <!-- 3. 公网网络 -->
      <a-form v-else-if="nodeStep === 3" :model="nodeForm" class="step-form" style="width:760px" :label-col-props="{ span: 5 }" :wrapper-col-props="{ span: 19 }">
        <a-form-item label="公网网口" extra="已按默认路由自动识别，一般无需修改">
          <a-radio-group v-model="nodeForm.wan" direction="vertical" style="width:100%">
            <a-radio v-for="n in detect.nics" :key="n.name" :value="n.name" :disabled="!n.up" class="nic-radio">
              <div class="nic-item"><b class="mono">{{ n.name }}</b>
                <a-tag v-if="n.def" size="small" color="green">默认路由</a-tag><a-tag v-if="!n.up" size="small">未连接</a-tag>
                <span class="muted mono">{{ n.ip4 || '无 IPv4' }}{{ n.ip6 ? ' · ' + n.ip6 : '' }}</span><span class="muted" style="margin-left:auto">{{ n.speed }}</span></div>
            </a-radio>
          </a-radio-group>
        </a-form-item>
        <a-form-item label="公网 IPv4" extra="取自网口地址；若为内网地址（如云厂商 NAT），会改用出口探测结果">
          <a-input v-model="nodeForm.wanIp"><template #append><a-link @click="redetect">重新检测</a-link></template></a-input></a-form-item>
        <a-form-item label="公网 IPv6" extra="留空则该节点不启用 IPv6 转发"><a-input v-model="nodeForm.wanIp6" allow-clear /></a-form-item>
        <a-form-item label="保留端口" extra="SSH、PVE Web 等端口不可分配给用户"><a-input-tag v-model="nodeForm.reserved" /></a-form-item>
        <a-form-item><a-space><a-button type="secondary" @click="nodeStep--">上一步</a-button><a-button type="primary" @click="nodeNext">下一步</a-button></a-space></a-form-item>
      </a-form>

      <!-- 4. 内网与 DHCP -->
      <a-form v-else-if="nodeStep === 4" :model="nodeForm" class="step-form" style="width:760px" :label-col-props="{ span: 5 }" :wrapper-col-props="{ span: 19 }">
        <a-form-item label="内网网桥">
          <a-radio-group v-model="nodeForm.lan" direction="vertical" style="width:100%" @change="onBridgeChange">
            <a-radio v-for="b in detect.bridges" :key="b.name" :value="b.name" class="nic-radio">
              <div class="nic-item"><b class="mono">{{ b.name }}</b><span class="muted mono">{{ b.cidr || '未配置地址' }}</span><span class="muted">{{ b.ports }} · {{ b.vms }} 台虚拟机</span></div>
            </a-radio>
            <a-radio value="__new" class="nic-radio"><div class="nic-item"><b>新建网桥</b>
              <a-input v-if="nodeForm.lan === '__new'" v-model="nodeForm.newBridge" size="small" style="width:120px" @click.stop /><span class="muted">无物理端口的内部网桥</span></div></a-radio>
          </a-radio-group>
        </a-form-item>
        <a-form-item label="内网网段" :extra="bridgeCidr ? '默认取网桥 ' + nodeForm.lan + ' 现有网段' : '默认 172.16.0.0/24，可自定义'"><a-input v-model="nodeForm.subnet" /></a-form-item>
        <a-form-item v-if="subnetDiffers" label="网段处理">
          <div style="width:100%">
            <a-radio-group v-model="nodeForm.addrMode"><a-radio value="append">追加地址（推荐）</a-radio><a-radio value="replace">替换原地址</a-radio></a-radio-group>
            <a-alert :type="nodeForm.addrMode === 'replace' ? 'warning' : 'info'" style="margin-top:8px">
              {{ nodeForm.lan }} 当前为 {{ bridgeCidr }}。{{ nodeForm.addrMode === 'replace' ? '替换后使用旧网段的虚拟机将断网，需重新获取地址。' : '在 ' + nodeForm.lan + ' 上追加 ' + gw(nodeForm.subnet) + '，原网段虚拟机不受影响。' }}</a-alert>
          </div>
        </a-form-item>
        <a-form-item label="网关"><a-input :model-value="gw(nodeForm.subnet)" disabled /></a-form-item>
        <a-form-item label="DHCP 服务">
          <div style="width:100%">
            <a-alert :type="detect.dhcp ? 'success' : 'warning'" style="margin-bottom:8px">{{ detect.dhcp ? '检测到 ' + detect.dhcp + ' 正在运行，将沿用现有配置' : '未检测到 DHCP 服务（dnsmasq / isc-dhcp-server / kea）' }}</a-alert>
            <template v-if="!detect.dhcp"><a-switch v-model="nodeForm.dhcp" /> 安装并启用 dnsmasq（仅 DHCP，不提供 DNS）</template>
          </div>
        </a-form-item>
        <template v-if="nodeForm.dhcp && !detect.dhcp">
          <a-form-item label="DHCP 动态范围"><a-input :model-value="range(nodeForm.subnet, 100, 250)" disabled /></a-form-item>
          <a-form-item label="DNS"><a-input-tag v-model="nodeForm.dns" /></a-form-item>
        </template>
        <a-form-item label="虚拟机分配池" extra="分配虚拟机时从此范围取 IP，与 DHCP 动态范围错开"><a-input :model-value="range(nodeForm.subnet, 10, 99)" disabled /></a-form-item>
        <a-form-item label="IPv6">
          <a-radio-group v-model="nodeForm.ipv6" :disabled="!nodeForm.wanIp6"><a-radio value="ula">内网 ULA + NAT</a-radio><a-radio value="off">不启用</a-radio></a-radio-group>
          <template #extra>{{ !nodeForm.wanIp6 ? '该节点未配置公网 IPv6，已禁用' : nodeForm.ipv6 === 'ula' ? '内网使用 ' + nodeForm.subnet6 + '，经公网 IPv6 转发' : '规则仅支持 IPv4' }}</template>
        </a-form-item>
        <a-form-item><a-space><a-button type="secondary" @click="nodeStep--">上一步</a-button><a-button type="primary" @click="nodeNext">下一步</a-button></a-space></a-form-item>
      </a-form>

      <!-- 5. 确认并应用 -->
      <div v-else class="step-form" style="width:820px">
        <template v-if="!applying && !applied">
          <a-descriptions :column="2" bordered title="配置摘要" :data="nodeSummary" />
          <div style="text-align:center;margin-top:32px"><a-space>
            <a-button type="secondary" @click="nodeStep--">上一步</a-button>
            <a-button type="primary" @click="applyNode"><template #icon><icon-check /></template>下发并初始化</a-button></a-space></div>
        </template>
        <template v-else>
          <a-result v-if="applied" status="success" :title="nodeForm.name + ' 已就绪'" subtitle="可以在用户管理中为用户分配该节点的端口和虚拟机">
            <template #extra><a-space><a-button type="primary" @click="go('nodes')">查看节点列表</a-button><a-button @click="go('users')">为用户分配</a-button></a-space></template>
          </a-result>
          <a-steps direction="vertical" :current="applyIdx + 1" small style="margin:0 auto;width:540px">
            <a-step v-for="(t, i) in applyTasks" :key="t" :status="i < applyIdx || applied ? 'finish' : i === applyIdx ? 'process' : 'wait'"
                    :description="i < applyIdx || applied ? '完成' : i === applyIdx ? 'Agent 执行中…' : ''">{{ t }}</a-step>
          </a-steps>
        </template>
      </div>
    </div>
  </a-card>
</div>

<!-- ============================================================ 凭证管理（查询表格） -->
<div v-else-if="page === 'creds'" class="container">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>PVE 节点</a-breadcrumb-item><a-breadcrumb-item>SSH 凭证</a-breadcrumb-item></a-breadcrumb>
  <a-card class="general-card" title="SSH 凭证">
    <template #extra><span class="muted">凭证在控制端加密保存，可被多个 SSH 节点复用；密码与私钥保存后不可查看</span></template>
    <a-row style="margin-bottom: 16px">
      <a-col :span="12"><a-space>
        <a-button type="primary" @click="openCred()"><template #icon><icon-plus /></template>新建凭证</a-button>
        <a-input-search v-model="credKw" placeholder="名称 / 用户名" style="width:220px" allow-clear /></a-space></a-col>
    </a-row>
    <a-table row-key="id" :data="creds.filter(c => !credKw || (c.name + c.user).includes(credKw))" :pagination="false" :bordered="false">
      <template #columns>
        <a-table-column title="名称" data-index="name" :width="180" />
        <a-table-column title="类型" :width="100"><template #cell="{ record }"><a-tag :color="record.type === 'key' ? 'arcoblue' : 'orange'">{{ record.type === 'key' ? '密钥' : '密码' }}</a-tag></template></a-table-column>
        <a-table-column title="用户名" :width="120"><template #cell="{ record }"><span class="mono">{{ record.user }}</span></template></a-table-column>
        <a-table-column title="指纹 / 说明"><template #cell="{ record }"><span v-if="record.type === 'key'" class="mono muted">{{ record.algo }} · {{ record.fp }}</span><span v-else class="muted">密码已加密保存</span></template></a-table-column>
        <a-table-column title="使用节点" :width="200"><template #cell="{ record }">
          <a-space v-if="nodes.filter(n => n.credId === record.id).length" :size="4" wrap><a-tag v-for="n in nodes.filter(n => n.credId === record.id)" :key="n.id" size="small">{{ n.name }}</a-tag></a-space><span v-else class="muted">未使用</span></template></a-table-column>
        <a-table-column title="更新时间" data-index="updated" :width="150" />
        <a-table-column title="操作" :width="160"><template #cell="{ record }"><a-space :size="0">
          <a-button type="text" size="small" @click="openCred(record)">编辑</a-button>
          <a-popconfirm :content="nodes.some(n => n.credId === record.id) ? '该凭证正被节点使用，无法删除' : '确定删除该凭证？'" type="warning">
            <a-button type="text" size="small" status="danger">删除</a-button></a-popconfirm></a-space></template></a-table-column>
      </template>
    </a-table>
  </a-card>
</div>

<!-- ============================================================ 节点配置（分组表单） -->
<div v-else-if="page === 'node-edit'" class="container with-actions">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>PVE 节点</a-breadcrumb-item><a-breadcrumb-item>节点配置 · {{ editNode.name }}</a-breadcrumb-item></a-breadcrumb>
  <a-form :model="editNode" layout="vertical">
    <a-space direction="vertical" :size="16" fill>
      <a-card class="general-card"><template #title>节点信息</template>
        <template #extra><a-badge :status="nodeBadge[editNode.status].badge" :text="nodeBadge[editNode.status].text + ' · 心跳 ' + editNode.lastSeen" /></template>
        <a-row :gutter="80">
          <a-col :span="8"><a-form-item label="节点名称"><a-input v-model="editNode.name" /></a-form-item></a-col>
          <a-col :span="8"><a-form-item label="备注"><a-input v-model="editNode.remark" /></a-form-item></a-col>
          <a-col :span="8"><a-form-item label="主机"><a-input :model-value="editNode.hostname + ' · PVE ' + editNode.pveVer" disabled /></a-form-item></a-col>
        </a-row>
        <a-row :gutter="80">
          <a-col :span="8"><a-form-item label="连接方式"><a-radio-group v-model="editNode.mode" type="button"><a-radio value="agent">Agent（WSS）</a-radio><a-radio value="ssh">SSH</a-radio></a-radio-group></a-form-item></a-col>
          <template v-if="editNode.mode === 'ssh'">
            <a-col :span="8"><a-form-item label="SSH 地址"><a-input-group style="width:100%"><a-input v-model="editNode.sshHost" style="width:72%" /><a-input-number v-model="editNode.sshPort" style="width:28%" /></a-input-group></a-form-item></a-col>
            <a-col :span="8"><a-form-item label="凭证"><a-select v-model="editNode.credId" :options="creds.map(c => ({ label: c.name + '（' + c.user + '）', value: c.id }))" /></a-form-item></a-col>
          </template>
          <a-col v-else :span="16"><a-form-item label="Agent"><a-input :model-value="'v' + (editNode.agentVer || '-') + ' · 已连接 ' + agentUrl" disabled /></a-form-item></a-col>
        </a-row>

<!-- ============================================================ 虚拟机（查询表格） -->
<div v-else-if="page === 'vms'" class="container">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>PVE 节点</a-breadcrumb-item><a-breadcrumb-item>虚拟机</a-breadcrumb-item></a-breadcrumb>
  <a-card class="general-card" title="虚拟机">

      <a-col :flex="1">

          <a-row :gutter="16">
            <a-col :span="8"><a-form-item label="节点"><a-select v-model="vmNode" :options="[{ label: '全部节点', value: 'all' }, ...readyNodes.map(n => ({ label: n.name, value: n.id }))]" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item label="关键词"><a-input v-model="vmKw" placeholder="VMID / 名称 / IP / MAC" /></a-form-item></a-col>

              <a-option value="__free">未分配</a-option><a-option value="__public">公共</a-option>
              <a-option v-for="u in users" :key="u.name" :value="u.name">{{ u.name }}</a-option></a-select></a-form-item></a-col>
            <a-col :span="8"><a-form-item label="类型"><a-select placeholder="全部" allow-clear :options="[{ label: '虚拟机 (VM)', value: 'qemu' }, { label: '容器 (CT)', value: 'lxc' }]" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item label="运行状态"><a-select placeholder="全部" allow-clear :options="['运行中', '已停止']" /></a-form-item></a-col>

        </a-form>
      </a-col>
      <a-divider style="height: 84px" direction="vertical" />
      <a-col flex="86px" style="text-align: right">
        <a-space direction="vertical" :size="18">
          <a-button type="primary"><template #icon><icon-search /></template>查询</a-button>
          <a-button @click="vmOwner = undefined; vmKw = ''; vmNode = 'all'"><template #icon><icon-refresh /></template>重置</a-button>
        </a-space>
      </a-col>
    </a-row>
    <a-divider style="margin-top: 0" />
    <a-row style="margin-bottom: 16px">
      <a-col :span="12"><a-button type="primary" @click="syncPve()"><template #icon><icon-sync /></template>同步全部节点</a-button></a-col>

        <span class="muted">共 {{ vms.length }} 台，未分配 {{ vms.filter(v => !v.owner && !v.shared).length }} 台 · 由各节点 Agent 每 60 秒上报</span>
      </a-col>
    </a-row>
    <a-table row-key="id" :data="vmRows" :pagination="{ showTotal: true, pageSize: 20 }" :bordered="false" :scroll="{ x: 1300 }">
      <template #columns>
        <a-table-column title="节点" :width="100"><template #cell="{ record }"><a-tag :color="nodeOf(record.node).status === 'online' ? 'arcoblue' : 'gray'">{{ nodeOf(record.node).name }}</a-tag></template></a-table-column>
        <a-table-column title="VMID" :width="80"><template #cell="{ record }"><span class="mono">{{ record.vmid }}</span></template></a-table-column>
        <a-table-column title="名称" data-index="host" :width="130" />
        <a-table-column title="类型" :width="70"><template #cell="{ record }"><a-tag :color="record.type === 'qemu' ? 'arcoblue' : 'cyan'">{{ record.type === 'qemu' ? 'VM' : 'CT' }}</a-tag></template></a-table-column>
        <a-table-column title="状态" :width="90"><template #cell="{ record }"><span class="circle" :class="{ pass: record.status === 'running' }"></span>{{ record.status === 'running' ? '运行中' : '已停止' }}</template></a-table-column>
        <a-table-column title="归属" :width="100"><template #cell="{ record }">
          <a-tag v-if="record.shared" color="arcoblue">公共</a-tag><a-space v-else-if="record.owner" :size="6"><icon-user />{{ record.owner }}</a-space><span v-else class="muted">未分配</span></template></a-table-column>
        <a-table-column title="MAC" :width="150"><template #cell="{ record }"><span class="mono">{{ record.mac }}</span></template></a-table-column>
        <a-table-column title="IPv4" :width="120"><template #cell="{ record }"><span class="mono">{{ record.v4 || '-' }}</span></template></a-table-column>
        <a-table-column title="IPv6" :width="120"><template #cell="{ record }"><span class="mono">{{ record.v6 || '-' }}</span></template></a-table-column>
        <a-table-column title="规则" :width="70"><template #cell="{ record }">{{ vmRuleCount(record.id) }} 条</template></a-table-column>
        <a-table-column title="操作" :width="220"><template #cell="{ record }"><a-space :size="0">
          <a-dropdown @select="name => assignVm(record, name)">
            <a-button type="text" size="small">分配给 <icon-down /></a-button>
            <template #content><a-doption v-for="u in users" :key="u.name" :value="u.name" :disabled="u.name === record.owner">{{ u.name }}</a-doption></template>
          </a-dropdown>
          <a-button type="text" size="small" @click="togglePublic(record)">{{ record.shared ? '取消公共' : '设为公共' }}</a-button>
          <a-popconfirm v-if="record.owner || record.shared" content="收回后 IP 保留，引用它的规则会被停用，确定收回？" type="warning" @ok="reclaimVm(record)">
            <a-button type="text" size="small" status="danger">收回</a-button></a-popconfirm></a-space></template></a-table-column>
      </template>
    </a-table>
  </a-card>
</div>

<!-- ============================================================ 系统设置（控制端，分组表单） -->

          <a-col :span="8"><a-form-item label="虚拟机同步间隔"><a-select default-value="60s" :options="['30s', '60s', '300s']" /></a-form-item></a-col>
          <a-col :span="8"><a-form-item label="规则健康检查间隔"><a-select default-value="60s" :options="['30s', '60s', '300s']" /></a-form-item></a-col>

      <a-card class="general-card"><template #title>公开监控页</template>

        <a-row :gutter="80">
          <a-col :span="8"><a-form-item label="页面标题"><a-input v-model="pub.title" /></a-form-item></a-col>
          <a-col :span="8"><a-form-item label="页面说明"><a-input v-model="pub.desc" placeholder="选填" /></a-form-item></a-col>

        <a-row :gutter="80">

              <a-checkbox v-model="pub.showNodes">节点概况</a-checkbox>

<!-- ============================================================ 个人资料 -->
<div v-else class="container">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>个人中心</a-breadcrumb-item><a-breadcrumb-item>个人资料</a-breadcrumb-item></a-breadcrumb>

    <a-card class="general-card" title="基本信息">
      <a-descriptions :column="3" :data="[
        { label: '用户名', value: me.name }, { label: '角色', value: isAdmin ? '管理员' : '普通用户' }, { label: '状态', value: me.status || '正常' },
        { label: '流量上限', value: me.quota || '不限' }, { label: '规则上限', value: isAdmin ? '不限' : String(me.maxRules) }, { label: '创建时间', value: '2026-09-01 10:12' } ]" />
    </a-card>
    <a-card class="general-card" title="修改密码">
      <a-form :model="{}" style="width:420px" :label-col-props="{ span: 6 }" :wrapper-col-props="{ span: 18 }">
        <a-form-item label="当前密码"><a-input-password /></a-form-item>
        <a-form-item label="新密码"><a-input-password /></a-form-item>
        <a-form-item label="确认新密码"><a-input-password /></a-form-item>
        <a-form-item><a-button type="primary">保存</a-button></a-form-item>
      </a-form>
    </a-card>
  </a-space>

        </a-layout-content>
      </a-layout>
    </a-layout>
  </a-layout>

  <!-- ======================= 弹窗：添加 / 编辑规则 ======================= -->
  <a-modal v-model:visible="ruleVisible" :title="ruleForm.id ? '编辑规则' : '添加规则'" :width="600" @ok="ruleVisible = false">
    <a-form :model="ruleForm" :label-col-props="{ span: 5 }" :wrapper-col-props="{ span: 19 }">
      <a-form-item label="所属用户" required :extra="isAdmin ? undefined : '规则只能创建在自己名下'">
        <a-select v-model="ruleForm.owner" :disabled="!isAdmin" @change="onOwnerChange">
          <a-option v-for="u in (isAdmin ? users : [me])" :key="u.name" :value="u.name">{{ u.name }}</a-option></a-select>
      </a-form-item>
      <a-form-item label="节点" required extra="仅列出该用户分配了端口的节点">
        <a-select v-model="ruleForm.node" placeholder="请选择节点" @change="onRuleNodeChange">
          <a-option v-for="g in allocByNode(ownerOf(ruleForm.owner))" :key="g.node" :value="g.node" :disabled="nodeOf(g.node).status !== 'online'">
            {{ nodeOf(g.node).name }}<span class="muted">（{{ nodeOf(g.node).wanIp }}{{ nodeOf(g.node).status !== 'online' ? '，离线' : '' }}）</span></a-option>
        </a-select>
      </a-form-item>
      <a-form-item label="监听端口" required
        :extra="ruleForm.node ? '只能从管理员分配的端口中选择。可选 ' + freePorts(ownerOf(ruleForm.owner), ruleForm.node).length + ' 个；已排除规则已使用 ' + portStat(ownerOf(ruleForm.owner), ruleForm.node).used + ' 个、宿主机占用 ' + portStat(ownerOf(ruleForm.owner), ruleForm.node).busy + ' 个' : '请先选择节点'">
        <a-select v-model="ruleForm.port" placeholder="请选择端口" :allow-search="false" :disabled="!ruleForm.node">
          <a-option v-for="p in freePorts(ownerOf(ruleForm.owner), ruleForm.node, ruleForm.port)" :key="p" :value="p" :label="String(p)" />
          <template #empty><div style="padding:12px;text-align:center" class="muted">没有可用端口，请联系管理员分配</div></template>
        </a-select>
      </a-form-item>
      <a-form-item label="协议" required>
        <a-radio-group v-model="ruleForm.proto"><a-radio value="TCP">TCP</a-radio><a-radio value="UDP">UDP</a-radio><a-radio value="TCP + UDP">TCP + UDP</a-radio></a-radio-group>
      </a-form-item>
      <a-form-item label="目标虚拟机" required :extra="'只能选择' + (isAdmin ? '该用户' : '自己') + '在此节点上的虚拟机或公共虚拟机'">
        <a-select v-model="ruleForm.vmId" placeholder="请选择虚拟机" :disabled="!ruleForm.node" @change="onVmChange">
          <a-optgroup :label="isAdmin ? ruleForm.owner + ' 的虚拟机' : '我的虚拟机'">
            <a-option v-for="v in vmsOf(ruleForm.owner).filter(v => v.node === ruleForm.node)" :key="v.id" :value="v.id" :label="v.vmid + ' ' + v.host + '  ' + ipLabel(v)" :disabled="!v.v4 && !v.v6">
              <div class="ip-opt"><span><span class="mono">{{ v.vmid }}</span> {{ v.host }}<span v-if="v.status !== 'running'" class="muted">（已停止）</span>
                <a-tag v-if="v.v4 && !v.v6" size="small" style="margin-left:4px">仅 IPv4</a-tag></span><span class="mono muted">{{ ipLabel(v) }}</span></div></a-option>
          </a-optgroup>
          <a-optgroup label="公共虚拟机">
            <a-option v-for="v in vms.filter(v => v.shared && v.node === ruleForm.node)" :key="v.id" :value="v.id" :label="v.vmid + ' ' + v.host + '  ' + ipLabel(v)">
              <div class="ip-opt"><span><span class="mono">{{ v.vmid }}</span> {{ v.host }}
                <a-tag v-if="v.v4 && !v.v6" size="small" style="margin-left:4px">仅 IPv4</a-tag></span><span class="mono muted">{{ ipLabel(v) }}</span></div></a-option>
          </a-optgroup>
        </a-select>
      </a-form-item>
      <!-- IP 版本：节点没有公网 IPv6，或所选虚拟机没有 IPv6 时，禁用含 v6 的选项 -->
      <a-form-item label="IP 版本" required :extra="ipverHint">
        <a-radio-group v-model="ruleForm.ipver">
          <a-radio value="v4">IPv4</a-radio>
          <a-radio value="v6" :disabled="!v6Allowed">IPv6</a-radio>
          <a-radio value="both" :disabled="!v6Allowed">IPv4 + IPv6</a-radio></a-radio-group>
      </a-form-item>
      <a-form-item label="目标端口" required><a-input-number v-model="ruleForm.tport" :min="1" :max="65535" placeholder="1 - 65535" /></a-form-item>
      <a-form-item label="备注"><a-input v-model="ruleForm.remark" :max-length="40" show-word-limit placeholder="选填" /></a-form-item>
    </a-form>
  </a-modal>

  <!-- ======================= 弹窗：新建 / 编辑 SSH 凭证 ======================= -->
