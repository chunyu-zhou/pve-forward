<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVE Forward · 设计原型（控制端 + Agent）</title>
<link rel="stylesheet" href="vendor/arco.min.css">
<style>
  /* ============ 全局（对齐 Arco Design Pro） ============ */
  html, body, #app { height: 100%; margin: 0; }
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; background: var(--color-fill-2); }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .muted { color: var(--color-text-3); font-size: 12px; }

  /* 布局：layout/default-layout.vue */
  .layout { width: 100%; height: 100%; }
  .layout-navbar { position: fixed; top: 0; left: 0; z-index: 100; width: 100%; height: 60px; }
  .layout-sider { position: fixed !important; top: 0; left: 0; z-index: 99; height: 100%; padding-top: 60px; transition: all .2s cubic-bezier(.34,.69,.1,1); }
  .layout-sider::after { position: absolute; top: 0; right: -1px; display: block; width: 1px; height: 100%; background: var(--color-border); content: ''; }
  .layout-sider > .arco-layout-sider-children { overflow-y: hidden; }
  .menu-wrapper { height: 100%; overflow: auto; overflow-x: hidden; }
  .menu-wrapper .arco-menu-inner .arco-menu-inline-header { display: flex; align-items: center; }
  .menu-wrapper .arco-menu-inner .arco-icon:not(.arco-icon-down) { font-size: 18px; }
  .layout-content { min-height: 100vh; background-color: var(--color-fill-2); transition: padding .2s cubic-bezier(.34,.69,.1,1); padding-top: 60px; }
  .container { padding: 0 20px 20px 20px; }
  .container.with-actions { padding-bottom: 80px; }

  /* 导航：components/navbar */
  .navbar { display: flex; justify-content: space-between; height: 100%; background: var(--color-bg-2); border-bottom: 1px solid var(--color-border); }
  .navbar .left-side { display: flex; align-items: center; padding-left: 20px; }
  .logo-mark { width: 28px; height: 28px; border-radius: 6px; background: rgb(var(--primary-6)); color: #fff; display: grid; place-items: center; font-size: 16px; }
  .navbar .right-side { display: flex; padding-right: 20px; list-style: none; margin: 0; }
  .navbar .right-side li { display: flex; align-items: center; padding: 0 10px; }
  .navbar .nav-btn { border-color: rgb(var(--gray-2)); color: rgb(var(--gray-8)); font-size: 16px; }

  /* 面包屑 */
  .container-breadcrumb { margin: 16px 0; }
  .container-breadcrumb .arco-breadcrumb-item { color: rgb(var(--gray-6)); }
  .container-breadcrumb .arco-breadcrumb-item:last-child { color: rgb(var(--gray-8)); }

  /* 卡片：assets/style/global.less */
  .general-card { border-radius: 4px; border: none; }
  .general-card > .arco-card-header { height: auto; padding: 20px; border: none; }
  .general-card > .arco-card-body { padding: 0 20px 20px 20px; }
  .circle { display: inline-block; margin-right: 4px; width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--gray-5)); vertical-align: middle; }
  .circle.pass { background: rgb(var(--green-6)); }
  .circle.err { background: rgb(var(--red-6)); }
  .circle.warn { background: rgb(var(--orange-6)); }
  .arco-table-th:last-child .arco-table-th-item-title { margin-left: 16px; }
  .action-icon { margin-left: 12px; cursor: pointer; color: var(--color-text-2); display: inline-flex; }

  /* 分组表单底部操作栏：views/form/group */
  .actions { position: fixed; right: 0; bottom: 0; height: 60px; padding: 14px 20px; box-sizing: border-box; background: var(--color-bg-2); text-align: right; z-index: 98;
    box-shadow: 0 -2px 8px rgba(0,0,0,.04); transition: left .2s cubic-bezier(.34,.69,.1,1); }

  /* 分步表单：views/form/step */
  .step-wrapper { display: flex; flex-direction: column; align-items: center; padding: 64px 0; background: var(--color-bg-2); }
  .step-wrapper .steps { margin-bottom: 64px; }
  .step-form .arco-form-item:last-child { margin-top: 20px; }
  .success-wrap { text-align: center; }
  .success-wrap .arco-result { padding-top: 0; }
  .details-wrapper { width: 895px; margin: 54px auto 0; padding: 20px; text-align: left; background: var(--color-fill-2); }

  /* 仪表盘：views/dashboard/workplace */
  .wp-container { padding: 16px 20px 20px; display: flex; background: var(--color-fill-2); }
  .wp-left { flex: 1; min-width: 0; }
  .wp-right { width: 280px; margin-left: 16px; }
  .panel { background-color: var(--color-bg-2); border-radius: 4px; overflow: auto; }
  .panel-border { margin-bottom: 0; border-bottom: 1px solid rgb(var(--gray-2)); }
  .wp-banner { width: 100%; padding: 20px 20px 0 20px; box-sizing: border-box; background: var(--color-bg-2); border-radius: 4px 4px 0 0; }
  .arco-grid.data-panel { margin-bottom: 0; padding: 16px 20px 0 20px; }
  .data-panel .panel-col { padding-left: 43px; border-right: 1px solid rgb(var(--gray-2)); }
  .data-panel .panel-col.last { border-right: none; }
  .col-avatar { margin-right: 12px; background-color: var(--color-fill-2) !important; }
  .unit { margin-left: 8px; color: rgb(var(--gray-8)); font-size: 12px; }
  .chart-legend { display: flex; gap: 20px; justify-content: center; font-size: 12px; color: var(--color-text-2); margin-bottom: 8px; }
  .chart-legend i, .donut-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .donut-wrap { display: flex; align-items: center; justify-content: center; gap: 32px; height: 300px; }
  .donut-legend div { display: grid; grid-template-columns: 14px 80px 40px 40px; align-items: center; font-size: 13px; line-height: 32px; color: var(--color-text-2); }
  .moduler-wrap .text { font-size: 12px; text-align: center; color: rgb(var(--gray-8)); }
  .moduler-wrap .wrapper { margin-bottom: 8px; text-align: center; cursor: pointer; }
  .moduler-wrap .wrapper:hover .icon { color: rgb(var(--arcoblue-6)); background-color: #e8f3ff; }
  .moduler-wrap .wrapper:hover .text { color: rgb(var(--arcoblue-6)); }
  .moduler-wrap .icon { display: inline-block; width: 32px; height: 32px; margin-bottom: 4px; color: rgb(var(--dark-gray-1)); line-height: 32px; font-size: 16px; text-align: center; background-color: rgb(var(--gray-1)); border-radius: 4px; }
  .split-line { border-color: rgb(var(--gray-2)); }
  .ann-item { display: flex; align-items: center; width: 100%; height: 24px; margin-bottom: 4px; }
  .ann-item .item-content { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 4px; color: var(--color-text-2); font-size: 13px; cursor: pointer; }
  .status-item { display: flex; justify-content: space-between; align-items: center; min-height: 28px; font-size: 13px; }
  .node-item { padding: 6px 0; border-bottom: 1px dashed var(--color-border-2); }
  .node-item:last-child { border-bottom: none; }
  .doc-link { margin: 10px 0; color: rgb(var(--gray-8)) !important; }

  /* 规则表 */
  .grp-row .arco-table-td { background: var(--color-fill-1) !important; }
  .grp { display: flex; align-items: center; gap: 10px; user-select: none; }
  .grp .nm { font-weight: 500; color: var(--color-text-1); }
  .grp .info { display: flex; gap: 20px; margin-left: 12px; color: var(--color-text-3); font-size: 13px; flex-wrap: wrap; }
  .grp .info b { color: var(--color-text-2); font-weight: 500; }
  .lines { line-height: 1.7; }
  .arco-table-td .arco-table-cell { white-space: nowrap; }
  .updown { line-height: 1.6; font-size: 12px; }
  .updown .d { color: rgb(var(--green-6)); } .updown .u { color: rgb(var(--orange-6)); }
  .ip-opt { display: flex; justify-content: space-between; gap: 12px; width: 100%; }

  /* 网络向导 / 安装命令 */
  .nic-radio { width: 100%; margin: 0 0 8px !important; padding: 10px 12px; border: 1px solid var(--color-border-2); border-radius: 4px; box-sizing: border-box; }
  .nic-radio.arco-radio-checked { border-color: rgb(var(--primary-6)); background: rgb(var(--primary-1)); }
  .nic-item { display: flex; align-items: center; gap: 10px; width: 100%; }
  .nic-radio .arco-radio-label { flex: 1; }
  .cmd { position: relative; background: #1d2129; color: #e5e6eb; border-radius: 4px; padding: 14px 16px; font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
  .cmd .copy { position: absolute; top: 8px; right: 8px; }
  .wait-box { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px dashed var(--color-border-3); border-radius: 4px; margin-top: 16px; }

  /* 控制端初始化 */
  .setup { min-height: 100%; background: var(--color-fill-2); }
  .setup-navbar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--color-bg-2); border-bottom: 1px solid var(--color-border); }
  .setup-body { max-width: 1000px; margin: 20px auto; padding: 0 20px 40px; }

  /* 登录：views/login */
  .login { display: flex; height: 100%; }
  .login .banner { width: 550px; background: linear-gradient(163.85deg, #1d2129 0%, #00308f 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
  .login .banner-inner { width: 380px; }
  .login .banner h2 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
  .login .banner p { color: rgba(255,255,255,.7); font-size: 14px; line-height: 22px; margin: 0; }
  .login .flow { margin-top: 32px; background: rgba(255,255,255,.08); border-radius: 4px; padding: 16px; font-family: Menlo, Consolas, monospace; font-size: 12px; line-height: 2; color: rgba(255,255,255,.85); }
  .login .content { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--color-bg-1); }
  .login .logo { position: fixed; top: 24px; left: 22px; z-index: 1; display: inline-flex; align-items: center; gap: 8px; color: #fff; font-size: 20px; font-weight: 500; }
  .login-form-wrapper { width: 320px; }
  .login-form-title { color: var(--color-text-1); font-weight: 500; font-size: 24px; line-height: 32px; }
  .login-form-sub-title { color: var(--color-text-3); font-size: 16px; line-height: 24px; }
  .login-form-error-msg { height: 32px; color: rgb(var(--red-6)); line-height: 32px; }
  .login-form-password-actions { display: flex; justify-content: space-between; }

  .proto-bar { position: fixed; right: 16px; bottom: 76px; z-index: 2000; background: var(--color-bg-2); border: 1px dashed var(--color-border-3); border-radius: 4px; padding: 8px 12px; }
  .proto-bar .t { font-size: 12px; color: var(--color-text-3); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="tpl">
  <!-- ======================= 控制端初始化（首次访问；只填控制端必要信息） ======================= -->
  <div v-if="page === 'setup'" class="setup">
    <div class="setup-navbar">
      <a-space><div class="logo-mark"><icon-swap /></div><a-typography-title :style="{ margin: 0, fontSize: '18px' }" :heading="5">PVE Forward</a-typography-title>
        <a-tag color="arcoblue" style="margin-left:8px">控制端初始化</a-tag></a-space>
      <span class="muted">控制端 v1.0.0</span>
    </div>
    <div class="setup-body">
      <a-card class="general-card">
        <template #title>初始化控制端</template>
        <template #extra><span class="muted">PVE 节点在初始化完成后，于「PVE 节点 → 添加节点」中接入</span></template>
        <div class="step-wrapper" style="padding:40px 0 48px">
          <a-steps :current="setupStep" style="width: 640px" line-less class="steps">
            <a-step description="令牌与管理员账号">验证</a-step>
            <a-step description="访问地址与端口">控制端设置</a-step>
            <a-step description="初始化完成">完成</a-step>
          </a-steps>

          <a-form v-if="setupStep === 1" :model="setupForm" class="step-form" style="width:560px" :label-col-props="{ span: 6 }" :wrapper-col-props="{ span: 18 }">
            <a-form-item label="初始化令牌" required :validate-status="setupErr.token ? 'error' : undefined"
              :help="setupErr.token || '安装控制端时终端已输出；也可执行 pve-forward setup-token 查看'">
              <a-input v-model="setupForm.token" placeholder="例如 7KQ2-M9XD-4TPA" allow-clear><template #prefix><icon-safe /></template></a-input></a-form-item>
            <a-form-item label="管理员账号" required><a-input v-model="setupForm.admin" /></a-form-item>
            <a-form-item label="密码" required :validate-status="setupErr.pwd ? 'error' : undefined" :help="setupErr.pwd">
              <a-input-password v-model="setupForm.pwd" placeholder="至少 8 位" /></a-form-item>
            <a-form-item label="确认密码" required :validate-status="setupErr.pwd2 ? 'error' : undefined" :help="setupErr.pwd2">
              <a-input-password v-model="setupForm.pwd2" placeholder="再次输入密码" /></a-form-item>
            <a-form-item><a-button type="primary" @click="setupNext">下一步</a-button></a-form-item>
          </a-form>

          <a-form v-else-if="setupStep === 2" :model="setupForm" class="step-form" style="width:600px" :label-col-props="{ span: 6 }" :wrapper-col-props="{ span: 18 }">
            <a-form-item label="站点名称"><a-input v-model="setupForm.site" /></a-form-item>
            <a-form-item label="控制端访问地址" required :validate-status="setupErr.url ? 'error' : undefined"
              :help="setupErr.url || 'Agent 通过此地址主动连接控制端，需能从各 PVE 节点访问；已按当前浏览器地址自动填写'">
              <a-input v-model="setupForm.url" placeholder="https://panel.example.com" /></a-form-item>
            <a-form-item label="面板端口" extra="Web 与 Agent 连接共用此端口"><a-input-number v-model="setupForm.port" :min="1" :max="65535" /></a-form-item>
            <a-form-item label="HTTPS 证书">
              <a-radio-group v-model="setupForm.tls"><a-radio value="self">自签名（默认）</a-radio><a-radio value="acme">Let's Encrypt</a-radio><a-radio value="proxy">由反向代理处理</a-radio></a-radio-group>
            </a-form-item>
            <a-form-item><a-space><a-button type="secondary" @click="setupStep--">上一步</a-button><a-button type="primary" @click="setupNext">完成初始化</a-button></a-space></a-form-item>
          </a-form>

          <div v-else class="success-wrap" style="width:100%">
            <a-result status="success" title="控制端初始化完成" subtitle="登录后在「PVE 节点 → 添加节点」中接入第一台 PVE" />
            <a-space :size="16"><a-button type="primary" @click="page = 'login'">进入登录</a-button></a-space>
            <div class="details-wrapper" style="width:640px">
              <a-descriptions :column="1" title="控制端信息" :data="[
                { label: '站点名称', value: setupForm.site }, { label: '访问地址', value: setupForm.url + ':' + setupForm.port },
                { label: 'Agent 连接地址', value: setupForm.url.replace(/^http/, 'ws') + ':' + setupForm.port + '/agent' }, { label: '管理员', value: setupForm.admin } ]" />
            </div>
          </div>
        </div>
      </a-card>
    </div>
  </div>

  <!-- ======================= 登录 ======================= -->
  <div v-else-if="page === 'login'" class="login">
    <div class="logo"><span class="logo-mark"><icon-swap /></span>PVE Forward</div>
    <div class="banner"><div class="banner-inner">
      <h2>多节点 PVE 端口转发管理</h2>
      <p>控制端统一管理用户、端口与规则，各 PVE 节点上的 Agent 通过 nftables DNAT 执行转发。</p>
      <div class="flow">客户端 → 节点公网 IP:端口<br>&nbsp;&nbsp;→ Agent · nftables DNAT<br>&nbsp;&nbsp;→ 节点内网虚拟机:端口<br><br>控制端 ⇄ Agent（WebSocket / TLS，Agent 主动连接）</div>
    </div></div>
    <div class="content">
      <div class="login-form-wrapper">
        <div class="login-form-title">登录 {{ setupForm.site }}</div>
        <div class="login-form-sub-title">使用管理员分配的账号登录</div>
        <div class="login-form-error-msg"></div>
        <a-form :model="loginForm" layout="vertical" @submit="doLogin">
          <a-form-item field="username" hide-label>
            <a-input v-model="loginForm.username" placeholder="用户名（输入 admin 进入管理端）"><template #prefix><icon-user /></template></a-input></a-form-item>
          <a-form-item field="password" hide-label>
            <a-input-password v-model="loginForm.password" placeholder="密码" allow-clear><template #prefix><icon-lock /></template></a-input-password></a-form-item>
          <a-space :size="16" direction="vertical" fill>
            <div class="login-form-password-actions"><a-checkbox default-checked>记住密码</a-checkbox><a-link>忘记密码请联系管理员</a-link></div>
            <a-button type="primary" html-type="submit" long>登录</a-button>
          </a-space>
        </a-form>
      </div>
    </div>
  </div>

  <a-layout v-else class="layout">
    <!-- ======================= 顶部导航 ======================= -->
    <div v-if="!isPublic" class="layout-navbar">
      <div class="navbar">
        <div class="left-side">
          <a-space><div class="logo-mark"><icon-swap /></div>
            <a-typography-title :style="{ margin: 0, fontSize: '18px' }" :heading="5">{{ setupForm.site }}</a-typography-title></a-space>
        </div>
        <ul class="right-side">
          <li v-if="isAdmin"><a-tag :color="nodes.every(n => n.status === 'online') ? 'green' : 'orange'" style="cursor:pointer" @click="go('nodes')">
            <template #icon><icon-cloud /></template>节点 {{ nodes.filter(n => n.status === 'online').length }} / {{ nodes.length }} 在线</a-tag></li>
          <li><a-tooltip content="切换主题"><a-button class="nav-btn" type="outline" shape="circle"><template #icon><icon-moon-fill /></template></a-button></a-tooltip></li>
          <li><a-tooltip content="消息通知"><a-badge :count="2" dot><a-button class="nav-btn" type="outline" shape="circle"><template #icon><icon-notification /></template></a-button></a-badge></a-tooltip></li>
          <li><a-tooltip content="全屏"><a-button class="nav-btn" type="outline" shape="circle"><template #icon><icon-fullscreen /></template></a-button></a-tooltip></li>
          <li>
            <a-dropdown trigger="click">
              <a-avatar :size="32" :style="{ cursor: 'pointer', backgroundColor: isAdmin ? '#165dff' : '#00b42a' }">{{ me.name[0].toUpperCase() }}</a-avatar>
              <template #content>
                <a-doption disabled><a-space><icon-user /><span>{{ me.name }}（{{ isAdmin ? '管理员' : '用户' }}）</span></a-space></a-doption>
                <a-doption @click="go('profile')"><a-space><icon-settings /><span>个人资料</span></a-space></a-doption>
                <a-doption @click="page = 'login'"><a-space><icon-export /><span>退出登录</span></a-space></a-doption>
              </template>
            </a-dropdown>
          </li>
        </ul>
      </div>
    </div>

    <a-layout>
      <!-- ======================= 左侧菜单 ======================= -->
      <a-layout-sider v-if="!isPublic" class="layout-sider" breakpoint="xl" :collapsed="collapsed" collapsible :width="220" hide-trigger @collapse="v => collapsed = v">
        <div class="menu-wrapper">
          <a-menu :key="isAdmin ? 'a' : 'u'" v-model:collapsed="collapsed" show-collapse-button :auto-open="false"
                  :level-indent="34" :selected-keys="[menuKey]" v-model:open-keys="openKeys" style="height:100%;width:100%" @menu-item-click="go">
            <a-menu-item key="dash"><template #icon><icon-dashboard /></template>仪表盘</a-menu-item>
            <a-menu-item key="monitor"><template #icon><icon-desktop /></template>资源监控</a-menu-item>
            <a-sub-menu key="fwd"><template #icon><icon-swap /></template><template #title>转发管理</template>
              <a-menu-item key="rules">转发规则</a-menu-item>
            </a-sub-menu>
            <a-sub-menu v-if="isAdmin" key="user"><template #icon><icon-user-group /></template><template #title>用户管理</template>
              <a-menu-item key="users">用户列表</a-menu-item>
              <a-menu-item key="user-new">添加用户</a-menu-item>
            </a-sub-menu>
            <a-sub-menu v-if="isAdmin" key="pve"><template #icon><icon-cloud /></template><template #title>PVE 节点</template>
              <a-menu-item key="nodes">节点列表</a-menu-item>
              <a-menu-item key="node-new">添加节点</a-menu-item>
              <a-menu-item key="vms">虚拟机</a-menu-item>
              <a-menu-item key="creds">SSH 凭证</a-menu-item>
            </a-sub-menu>
            <a-menu-item v-if="isAdmin" key="settings"><template #icon><icon-settings /></template>系统设置</a-menu-item>
            <a-sub-menu key="me"><template #icon><icon-user /></template><template #title>个人中心</template>
              <a-menu-item key="profile">个人资料</a-menu-item>
            </a-sub-menu>
          </a-menu>
        </div>
      </a-layout-sider>

      <a-layout class="layout-content" :style="isPublic ? { padding: 0 } : { paddingLeft: (collapsed ? 48 : 220) + 'px' }">
        <a-layout-content>

<!-- ============================================================ 仪表盘（dashboard/workplace） -->
<div v-if="page === 'dash'" class="wp-container">
  <div class="wp-left">
    <div class="panel">
      <div class="wp-banner">
        <a-typography-title :heading="5" style="margin-top: 0">欢迎回来！{{ me.name }}</a-typography-title>
        <a-divider class="panel-border" />
      </div>
      <a-grid :cols="24" :row-gap="16" class="data-panel">
        <a-grid-item v-for="(s, i) in stats" :key="s.title" class="panel-col" :class="{ last: i === stats.length - 1 }" :span="6">
          <a-space>
            <a-avatar :size="54" class="col-avatar"><component :is="s.icon" :style="{ color: s.color, fontSize: '24px' }" /></a-avatar>
            <a-statistic :title="s.title" :value="s.value" :precision="s.precision || 0" :value-from="0" animation show-group-separator>
              <template #suffix><span class="unit">{{ s.unit }}</span></template>
            </a-statistic>
          </a-space>
          <div class="muted" style="margin:6px 0 0 66px">{{ s.sub }}</div>
        </a-grid-item>
        <a-grid-item :span="24"><a-divider class="panel-border" style="margin: 4px 0 0 0" /></a-grid-item>
      </a-grid>
      <a-card class="general-card" title="流量趋势" :header-style="{ paddingBottom: 0 }" :body-style="{ paddingTop: '20px' }">
        <template #extra>
          <a-space>
            <a-select v-model="chartNode" size="small" style="width:140px" :options="[{ label: '全部节点', value: 'all' }, ...readyNodes.map(n => ({ label: n.name, value: n.id }))]" />
            <a-radio-group v-model="chartRange" type="button" size="small"><a-radio value="24h">近 24 小时</a-radio><a-radio value="7d">近 7 天</a-radio></a-radio-group>
          </a-space>
        </template>
        <div class="chart-legend"><span><i style="background:#165dff"></i>入向</span><span><i style="background:#ff7d00"></i>出向</span></div>
        <svg :viewBox="'0 0 ' + chart.W + ' ' + chart.H" style="width:100%;height:280px;display:block" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#165dff" stop-opacity=".18" /><stop offset="100%" stop-color="#165dff" stop-opacity="0" /></linearGradient>
            <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff7d00" stop-opacity=".14" /><stop offset="100%" stop-color="#ff7d00" stop-opacity="0" /></linearGradient>
          </defs>
          <g v-for="t in chart.ticks" :key="t.y">
            <line :x1="chart.L" :x2="chart.W - chart.R" :y1="t.y" :y2="t.y" stroke="#e5e6eb" stroke-dasharray="3 3" />
            <text :x="chart.L - 8" :y="t.y + 4" text-anchor="end" font-size="11" fill="#86909c">{{ t.label }}</text>
          </g>
          <text v-for="x in chart.xs" :key="x.label" :x="x.x" :y="chart.H - 6" text-anchor="middle" font-size="11" fill="#86909c">{{ x.label }}</text>
          <path :d="chart.inArea" fill="url(#gIn)" /><path :d="chart.outArea" fill="url(#gOut)" />
          <path :d="chart.inLine" fill="none" stroke="#165dff" stroke-width="2" /><path :d="chart.outLine" fill="none" stroke="#ff7d00" stroke-width="2" />
        </svg>
      </a-card>
    </div>
    <a-grid :cols="24" :col-gap="16" :row-gap="16" style="margin-top: 16px">
      <a-grid-item :span="12">
        <a-card class="general-card" title="流量排行" :header-style="{ paddingBottom: 0 }" :body-style="{ padding: '17px 20px 21px 20px' }" style="min-height:395px">
          <template #extra><a-link @click="go('rules')">查看更多</a-link></template>
          <a-space direction="vertical" :size="10" fill>
            <a-radio-group v-model="rankProto" type="button"><a-radio value="all">全部</a-radio><a-radio value="TCP">TCP</a-radio><a-radio value="UDP">UDP</a-radio></a-radio-group>
            <a-table :data="ranking" :pagination="false" :bordered="false" :scroll="{ x: '100%', y: '264px' }" row-key="id">
              <template #columns>
                <a-table-column title="排名" :width="56"><template #cell="{ rowIndex }">{{ rowIndex + 1 }}</template></a-table-column>
                <a-table-column title="规则"><template #cell="{ record }"><a-typography-paragraph :ellipsis="{ rows: 1 }" style="margin:0">{{ record.remark || '-' }} <span class="muted mono">{{ nodeOf(record.node).name }}:{{ record.port }}</span></a-typography-paragraph></template></a-table-column>
                <a-table-column v-if="isAdmin" title="用户" data-index="owner" :width="70" />
                <a-table-column title="24H 流量" :width="96"><template #cell="{ record }">{{ fmtMB(h24[record.id] || 0) }}</template></a-table-column>
                <a-table-column title="日涨幅" :width="84"><template #cell="{ record }">
                  <span>{{ Math.abs(trend[record.id] || 0) }}%</span>
                  <icon-caret-up v-if="(trend[record.id] || 0) > 0" style="color:#f53f3f;font-size:8px;margin-left:4px" />
                  <icon-caret-down v-else-if="(trend[record.id] || 0) < 0" style="color:#00b42a;font-size:8px;margin-left:4px" /></template></a-table-column>
              </template>
            </a-table>
          </a-space>
        </a-card>
      </a-grid-item>
      <a-grid-item :span="12">
        <a-card class="general-card" title="规则构成" :header-style="{ paddingBottom: 0 }" :body-style="{ padding: '20px' }" style="min-height:395px">
          <template #extra><a-radio-group v-model="pieBy" type="button" size="small"><a-radio value="node">按节点</a-radio><a-radio value="proto">按协议</a-radio><a-radio value="ipver">按 IP 版本</a-radio></a-radio-group></template>
          <div class="donut-wrap">
            <svg viewBox="0 0 220 220" width="240" height="240">
              <circle cx="110" cy="110" r="78" fill="none" stroke="#f2f3f5" stroke-width="26" />
              <circle v-for="seg in pie.segs" :key="seg.name" cx="110" cy="110" r="78" fill="none" :stroke="seg.color" stroke-width="26"
                      :stroke-dasharray="seg.len + ' ' + (pie.C - seg.len)" :stroke-dashoffset="-seg.off" transform="rotate(-90 110 110)" />
              <text x="110" y="104" text-anchor="middle" font-size="12" fill="#86909c">规则总数</text>
              <text x="110" y="130" text-anchor="middle" font-size="24" font-weight="500" fill="#1d2129">{{ pie.total }}</text>
            </svg>
            <div class="donut-legend">
              <div v-for="seg in pie.segs" :key="seg.name"><i :style="{ background: seg.color }"></i><span>{{ seg.name }}</span><b>{{ seg.value }}</b><span class="muted">{{ pie.total ? Math.round(seg.value / pie.total * 100) : 0 }}%</span></div>
            </div>
          </div>
        </a-card>
      </a-grid-item>
    </a-grid>
  </div>

  <div class="wp-right">
    <a-grid :cols="24" :row-gap="16">
      <a-grid-item :span="24">
        <div class="panel moduler-wrap">
          <a-card class="general-card" title="快捷操作" :header-style="{ paddingBottom: 0 }" :body-style="{ padding: '24px 20px 0 20px' }">
            <a-row :gutter="8">
              <a-col v-for="q in quickOps" :key="q.text" :span="8" class="wrapper" @click="q.run()">
                <div class="icon"><component :is="q.icon" /></div>
                <a-typography-paragraph class="text">{{ q.text }}</a-typography-paragraph>
              </a-col>
            </a-row>
            <a-divider class="split-line" style="margin: 0" />
          </a-card>
          <a-card class="general-card" title="最近访问" :header-style="{ paddingBottom: 0 }" :body-style="{ paddingTop: '26px' }">
            <div style="margin-bottom: -1rem">
              <a-row :gutter="8">
                <a-col v-for="q in recent" :key="q.text" :span="8" class="wrapper" @click="go(q.key)">
                  <div class="icon"><component :is="q.icon" /></div>
                  <a-typography-paragraph class="text">{{ q.text }}</a-typography-paragraph>
                </a-col>
              </a-row>
            </div>
          </a-card>
        </div>
      </a-grid-item>

      <a-grid-item class="panel" :span="24">
        <a-card v-if="isAdmin" class="general-card" title="节点状态" :header-style="{ paddingBottom: 0 }" :body-style="{ padding: '12px 20px 12px 20px' }">
          <template #extra><a-link @click="go('nodes')">管理</a-link></template>
          <div v-for="n in nodes" :key="n.id" class="node-item">
            <div class="status-item"><span><b style="font-weight:500">{{ n.name }}</b> <span class="muted">{{ n.remark }}</span></span>
              <a-badge :status="nodeBadge[n.status].badge" :text="nodeBadge[n.status].text" /></div>
            <div class="muted">{{ n.initialized ? n.wanIp + ' · ' + n.subnet : '等待网络初始化' }}<template v-if="n.status === 'online' && n.initialized"> · CPU {{ n.cpu }}% · 内存 {{ n.mem }}%</template><template v-if="n.status === 'offline'"> · 最后心跳 {{ n.lastSeen }}</template></div>
          </div>
        </a-card>
        <a-card v-else class="general-card" title="我的配额" :header-style="{ paddingBottom: 0 }" :body-style="{ padding: '12px 20px 12px 20px' }">
          <div v-for="g in allocByNode(me)" :key="g.node" class="node-item">
            <div class="status-item"><b style="font-weight:500">{{ nodeOf(g.node).name }}</b><span>端口 {{ usedPorts(me, g.node).length }} / {{ allPorts(me, g.node).length }}</span></div>
            <a-progress :percent="allPorts(me, g.node).length ? usedPorts(me, g.node).length / allPorts(me, g.node).length : 0" :show-text="false" size="small" />
          </div>
          <div class="status-item"><span class="muted" style="font-size:13px">规则</span><span>{{ me.rules.length }} / {{ me.maxRules }}</span></div>
          <div class="status-item"><span class="muted" style="font-size:13px">流量</span><span>{{ me.traffic }} / {{ me.quota || '不限' }}</span></div>
          <div class="status-item"><span class="muted" style="font-size:13px">虚拟机</span><span>{{ vmsOf(me.name).length }} 台</span></div>
        </a-card>
      </a-grid-item>

      <a-grid-item class="panel" :span="24">
        <a-card class="general-card" title="事件通知" :header-style="{ paddingBottom: 0 }" :body-style="{ padding: '15px 20px 13px 20px' }">
          <template #extra><a-link @click="query.status = 'err'; go('rules')">查看异常</a-link></template>
          <div v-for="(e, idx) in events" :key="idx" class="ann-item">
            <a-tag :color="e.type" size="small">{{ e.label }}</a-tag>
            <a-tooltip :content="e.content"><span class="item-content">{{ e.content }}</span></a-tooltip>
          </div>
        </a-card>
      </a-grid-item>

      <a-grid-item class="panel" :span="24">
        <a-card class="general-card" title="帮助文档" :header-style="{ paddingBottom: 0 }" :body-style="{ paddingTop: 0 }" style="height: 166px">
          <a-row>
            <a-col :span="12"><a-link class="doc-link">安装控制端</a-link></a-col>
            <a-col :span="12"><a-link class="doc-link">接入 PVE 节点</a-link></a-col>
            <a-col :span="12"><a-link class="doc-link">规则与端口说明</a-link></a-col>
            <a-col :span="12"><a-link class="doc-link">常见问题</a-link></a-col>
          </a-row>
        </a-card>
      </a-grid-item>
    </a-grid>
  </div>
</div>

<!-- ============================================================ 转发规则（查询表格） -->
<div v-else-if="page === 'rules'" class="container">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>转发管理</a-breadcrumb-item><a-breadcrumb-item>转发规则</a-breadcrumb-item></a-breadcrumb>

  <a-card v-if="!isAdmin" class="general-card" title="我的配额" style="margin-bottom:16px">
    <a-descriptions :column="3" :data="[
      ...allocByNode(me).map(g => ({ label: nodeOf(g.node).name + ' 端口', value: g.labels.join(' · ') + '（已用 ' + usedPorts(me, g.node).length + '/' + allPorts(me, g.node).length + '）' })),
      { label: '规则', value: me.rules.length + ' / ' + me.maxRules },
      { label: '我的虚拟机', value: vmsOf(me.name).map(v => nodeOf(v.node).name + '/' + v.vmid + ' ' + v.host).join('，') },
      { label: '流量', value: me.traffic + ' / ' + (me.quota || '不限') } ]" />
  </a-card>

  <a-card class="general-card" title="转发规则">
    <a-row>
      <a-col :flex="1">
        <a-form :model="query" :label-col-props="{ span: 6 }" :wrapper-col-props="{ span: 18 }" label-align="left">
          <a-row :gutter="16">
            <a-col :span="8"><a-form-item field="kw" label="关键词"><a-input v-model="query.kw" placeholder="端口 / IP / 备注" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item field="node" label="节点">
              <a-select v-model="query.node" placeholder="全部" allow-clear>
                <a-option v-for="n in readyNodes" :key="n.id" :value="n.id">{{ n.name }}</a-option></a-select></a-form-item></a-col>
            <a-col :span="8"><a-form-item field="owner" label="所属用户">
              <a-select v-model="query.owner" :disabled="!isAdmin" placeholder="全部" allow-clear>
                <a-option v-for="u in (isAdmin ? users : [me])" :key="u.name" :value="u.name">{{ u.name }}</a-option></a-select></a-form-item></a-col>
            <a-col :span="8"><a-form-item field="proto" label="协议">
              <a-select v-model="query.proto" placeholder="全部" allow-clear :options="['TCP', 'UDP', 'TCP + UDP']" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item field="ipver" label="IP 版本">
              <a-select v-model="query.ipver" placeholder="全部" allow-clear :options="[{ label: 'IPv4', value: 'v4' }, { label: 'IPv6', value: 'v6' }, { label: 'IPv4 + IPv6', value: 'both' }]" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item field="status" label="状态">
              <a-select v-model="query.status" placeholder="全部" allow-clear :options="[{ label: '正常', value: 'on' }, { label: '异常', value: 'err' }, { label: '已停用', value: 'off' }]" /></a-form-item></a-col>
          </a-row>
        </a-form>
      </a-col>
      <a-divider style="height: 84px" direction="vertical" />
      <a-col flex="86px" style="text-align: right">
        <a-space direction="vertical" :size="18">
          <a-button type="primary"><template #icon><icon-search /></template>查询</a-button>
          <a-button @click="resetQuery"><template #icon><icon-refresh /></template>重置</a-button>
        </a-space>
      </a-col>
    </a-row>
    <a-divider style="margin-top: 0" />
    <a-row style="margin-bottom: 16px">
      <a-col :span="14">
        <a-space>
          <a-button type="primary" @click="openRule()"><template #icon><icon-plus /></template>添加规则</a-button>
          <a-button :disabled="!selectedRules.length" @click="batchSet(true)">批量启用</a-button>
          <a-button :disabled="!selectedRules.length" @click="batchSet(false)">批量停用</a-button>
          <a-popconfirm :content="'确定删除选中的 ' + selectedRules.length + ' 条规则？'" type="warning">
            <a-button :disabled="!selectedRules.length" status="danger">批量删除</a-button></a-popconfirm>
          <span v-if="selectedRules.length" class="muted">已选 {{ selectedRules.length }} 条 <a-link @click="selectedKeys = []">取消选择</a-link></span>
        </a-space>
      </a-col>
      <a-col :span="10" style="display:flex;align-items:center;justify-content:end">
        <a-space v-if="isAdmin" style="margin-right:12px"><span class="muted">按用户分组</span><a-switch v-model="grouped" size="small" /></a-space>
        <a-tooltip content="刷新"><div class="action-icon"><icon-refresh size="18" /></div></a-tooltip>
        <a-dropdown @select="v => density = v">
          <a-tooltip content="密度"><div class="action-icon"><icon-line-height size="18" /></div></a-tooltip>
          <template #content><a-doption value="mini">迷你</a-doption><a-doption value="small">偏小</a-doption><a-doption value="medium">中等</a-doption><a-doption value="large">偏大</a-doption></template>
        </a-dropdown>
        <a-tooltip content="列设置"><div class="action-icon"><icon-settings size="18" /></div></a-tooltip>
      </a-col>
    </a-row>

    <a-alert v-if="errRules.length" type="error" style="margin-bottom:16px" closable>
      {{ errRules.length }} 条规则运行异常（{{ errRules.map(r => nodeOf(r.node).name + ':' + r.port + ' ' + r.err).join('；') }}）
      <template #action><a-button size="mini" type="text" @click="query.status = 'err'">只看异常</a-button></template>
    </a-alert>
    <!-- 分组模式为树形数据：勾选用户行 = 勾选该用户全部规则 -->
    <a-table row-key="key" :data="tableRows" :columns="columns" :pagination="false" :bordered="false" :size="density"
             :row-selection="{ type: 'checkbox', showCheckedAll: true, checkStrictly: false }" v-model:selected-keys="selectedKeys"
             v-model:expanded-keys="expandedKeys" :indent-size="0" :span-method="spanMethod" :row-class="r => r.group ? 'grp-row' : ''" :scroll="{ x: 1340 }">
      <template #status="{ record }">
        <template v-if="!record.group">
          <a-tooltip v-if="record.enabled && ruleErr(record)" :content="ruleErr(record)">
            <span style="color:rgb(var(--red-6));cursor:help"><span class="circle err"></span>异常 <icon-question-circle /></span></a-tooltip>
          <template v-else><span class="circle" :class="{ pass: record.enabled }"></span>{{ record.enabled ? '正常' : '已停用' }}</template>
        </template>
        <div v-else class="grp">
          <a-avatar :size="24" :style="{ backgroundColor: record.user.color }">{{ record.user.name[0].toUpperCase() }}</a-avatar>
          <span class="nm">{{ record.user.name }}</span>
          <a-tag size="small">{{ record.user.rules.length }} 条</a-tag>
          <a-tag v-if="record.user.rules.some(r => r.enabled && ruleErr(r))" size="small" color="red">异常 {{ record.user.rules.filter(r => r.enabled && ruleErr(r)).length }}</a-tag>
          <a-badge :status="{ '正常': 'success', '已禁用': 'normal' }[record.user.status] || 'danger'" :text="record.user.status" />
          <div class="info">
            <span v-for="g in allocByNode(record.user)" :key="g.node">{{ nodeOf(g.node).name }} <b class="mono">{{ g.labels.join(' · ') }}</b></span>
            <span>虚拟机 <b>{{ vmsOf(record.user.name).length }}</b> 台</span>
            <span>流量 <b>{{ record.user.traffic }}</b> / {{ record.user.quota || '不限' }}</span>
          </div>
          <a-space style="margin-left:auto" @click.stop>
            <a-button type="text" size="mini" @click="openUser(record.user)">编辑用户</a-button>
            <a-button type="text" size="mini" @click="openRule(null, record.user)">代加规则</a-button>
          </a-space>
        </div>
      </template>
      <template #node="{ record }"><a-tag size="small" :color="nodeOf(record.node).status === 'online' ? 'arcoblue' : 'gray'">{{ nodeOf(record.node).name }}</a-tag></template>
      <template #remark="{ record }">{{ record.remark || '-' }}</template>
      <template #entry="{ record }"><div class="lines"><div v-for="l in entryLines(record)" :key="l" class="mono">{{ l }}</div></div></template>
      <template #exit="{ record }"><div class="lines">
        <div v-for="l in exitLines(record)" :key="l" class="mono">{{ l }}</div>
        <a-space :size="4"><span class="muted"><span class="mono">{{ vmOf(record.vmId).vmid }}</span> {{ vmOf(record.vmId).host }}</span><a-tag v-if="vmOf(record.vmId).shared" size="small" color="arcoblue">公共</a-tag></a-space>
      </div></template>
      <template #ipver="{ record }"><a-tag :color="{ v4: 'arcoblue', v6: 'purple', both: 'green' }[record.ipver]">{{ ipverName[record.ipver] }}</a-tag></template>
      <template #proto="{ record }"><a-tag>{{ record.proto }}</a-tag></template>
      <template #traffic="{ record }"><div class="updown"><div>累计 {{ record.total }}</div><span class="d"><icon-arrow-down /> {{ record.down }}</span>&nbsp; <span class="u"><icon-arrow-up /> {{ record.up }}</span></div></template>
      <template #conn="{ record }">{{ record.enabled && !ruleErr(record) ? record.conn : '-' }}</template>
      <template #switch="{ record }"><a-switch v-model="record.enabled" size="small" /></template>
      <template #operations="{ record }">
        <a-space :size="0"><a-button type="text" size="small" @click="openRule(record)">编辑</a-button>
        <a-popconfirm content="删除后该端口立即停止转发，确定删除？" type="warning"><a-button type="text" size="small" status="danger">删除</a-button></a-popconfirm></a-space>
      </template>
    </a-table>
    <a-pagination :total="visibleRules.length" show-total show-page-size :page-size="20" style="justify-content:flex-end;margin-top:16px" />
  </a-card>
</div>

<!-- ============================================================ 用户列表（查询表格） -->
<div v-else-if="page === 'users'" class="container">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>用户管理</a-breadcrumb-item><a-breadcrumb-item>用户列表</a-breadcrumb-item></a-breadcrumb>
  <a-card class="general-card" title="用户列表">
    <a-row>
      <a-col :flex="1">
        <a-form :model="{}" :label-col-props="{ span: 6 }" :wrapper-col-props="{ span: 18 }" label-align="left">
          <a-row :gutter="16">
            <a-col :span="8"><a-form-item label="用户名"><a-input placeholder="请输入用户名" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item label="节点"><a-select placeholder="全部" allow-clear :options="readyNodes.map(n => ({ label: n.name, value: n.id }))" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item label="状态"><a-select placeholder="全部" allow-clear :options="['正常', '已禁用', '流量超限']" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item label="包含端口"><a-input-number placeholder="例如 20001" :min="1" :max="65535" /></a-form-item></a-col>
            <a-col :span="8"><a-form-item label="虚拟机"><a-input placeholder="VMID / 名称 / IP" /></a-form-item></a-col>
          </a-row>
        </a-form>
      </a-col>
      <a-divider style="height: 84px" direction="vertical" />
      <a-col flex="86px" style="text-align: right">
        <a-space direction="vertical" :size="18">
          <a-button type="primary"><template #icon><icon-search /></template>查询</a-button>
          <a-button><template #icon><icon-refresh /></template>重置</a-button>
        </a-space>
      </a-col>
    </a-row>
    <a-divider style="margin-top: 0" />
    <a-row style="margin-bottom: 16px">
      <a-col :span="12"><a-button type="primary" @click="openNewUser"><template #icon><icon-plus /></template>添加用户</a-button></a-col>
      <a-col :span="12" style="display:flex;align-items:center;justify-content:end">
        <span class="muted">已分配 {{ totalAllocated }} 个端口 · {{ vms.filter(v => v.owner).length }} 台虚拟机</span>
        <a-tooltip content="刷新"><div class="action-icon"><icon-refresh size="18" /></div></a-tooltip>
      </a-col>
    </a-row>
    <a-table row-key="name" :data="users" :pagination="{ showTotal: true, pageSize: 20 }" :bordered="false" :scroll="{ x: 1320 }">
      <template #columns>
        <a-table-column title="用户" :width="120"><template #cell="{ record }">
          <a-space><a-avatar :size="24" :style="{ backgroundColor: record.color }">{{ record.name[0].toUpperCase() }}</a-avatar>{{ record.name }}</a-space></template></a-table-column>
        <a-table-column title="状态" :width="100"><template #cell="{ record }">
          <span class="circle" :class="{ pass: record.status === '正常', err: record.status === '流量超限' }"></span>{{ record.status }}</template></a-table-column>
        <a-table-column title="端口分配（按节点）" :width="300"><template #cell="{ record }">
          <div v-for="g in allocByNode(record)" :key="g.node" style="line-height:1.9">
            <a-tag size="small" color="arcoblue">{{ nodeOf(g.node).name }}</a-tag> <span class="mono">{{ g.labels.join(' · ') }}</span>
            <span class="muted"> 已用 {{ usedPorts(record, g.node).length }}/{{ allPorts(record, g.node).length }}</span></div></template></a-table-column>
        <a-table-column title="虚拟机" :width="260"><template #cell="{ record }">
          <div v-for="v in vmsOf(record.name)" :key="v.id" style="line-height:1.9"><span class="muted">{{ nodeOf(v.node).name }}/</span><span class="mono">{{ v.vmid }}</span> {{ v.host }} <span class="muted mono">{{ v.v4 }}</span></div></template></a-table-column>
        <a-table-column title="规则" :width="110"><template #cell="{ record }">{{ record.rules.length }} / {{ record.maxRules }}
          <a-tag v-if="record.rules.some(r => r.enabled && ruleErr(r))" size="small" color="red" style="margin-left:4px">异常 {{ record.rules.filter(r => r.enabled && ruleErr(r)).length }}</a-tag></template></a-table-column>
        <a-table-column title="流量" :width="150"><template #cell="{ record }">{{ record.traffic }} / {{ record.quota || '不限' }}</template></a-table-column>
        <a-table-column title="操作" :width="210"><template #cell="{ record }"><a-space :size="0">
          <a-button type="text" size="small" @click="openUser(record)">编辑</a-button>
          <a-button type="text" size="small" @click="query.owner = record.name; go('rules')">查看规则</a-button>
          <a-dropdown><a-button type="text" size="small">更多 <icon-down /></a-button>
            <template #content><a-doption>重置密码</a-doption><a-doption>{{ record.status === '已禁用' ? '启用' : '禁用' }}</a-doption><a-doption style="color:rgb(var(--red-6))">删除用户</a-doption></template>
          </a-dropdown></a-space></template></a-table-column>
      </template>
    </a-table>
  </a-card>
</div>

<!-- ============================================================ 资源监控（参考 Pulse Proxmox Overview） -->
<!-- 公开访问：未开放 / 需要访问密码 -->
<div v-else-if="isPublic && (!pub.enabled || (pub.access === 'password' && !pubUnlocked))" class="pub-gate">
  <a-card class="general-card" style="width:420px">
    <div style="text-align:center;padding:24px 0 8px">
      <div class="logo-mark" style="margin:0 auto 12px;width:40px;height:40px;font-size:22px"><icon-swap /></div>
      <a-typography-title :heading="5" style="margin:0 0 4px">{{ pub.title }}</a-typography-title>
      <template v-if="!pub.enabled"><a-result status="404" title="页面未开放" subtitle="管理员未开启公开监控页" style="padding:16px 0 0" /></template>
      <template v-else>
        <div class="muted" style="margin-bottom:20px">请输入访问密码</div>
        <a-input-password v-model="pubPwd" placeholder="访问密码" @press-enter="unlockPub" />
        <div v-if="pubPwdErr" style="color:rgb(var(--red-6));font-size:12px;margin-top:6px;text-align:left">{{ pubPwdErr }}</div>
        <a-button type="primary" long style="margin-top:16px" @click="unlockPub">进入</a-button>
      </template>
    </div>
  </a-card>
</div>

<div v-else-if="page === 'monitor' || isPublic" class="container" :class="{ 'pub-page': isPublic }">
  <a-breadcrumb v-if="!isPublic" class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>资源监控</a-breadcrumb-item></a-breadcrumb>
  <!-- 公开页标题（无导航、无菜单） -->
  <div v-else class="pub-head">
    <a-space :size="12"><div class="logo-mark"><icon-swap /></div>
      <div><div class="pub-title">{{ pub.title }}</div><div class="muted">{{ pub.desc }}</div></div></a-space>
    <a-space :size="16"><a-badge :status="monNodes.every(n => n.status === 'online') ? 'success' : 'warning'" :text="monNodes.every(n => n.status === 'online') ? '全部节点正常' : '部分节点异常'" />
      <span class="muted">更新于 {{ monUpdated }} · 每 {{ pub.refresh }} 刷新</span></a-space>
  </div>

  <!-- 汇总 -->
  <a-card class="general-card" :body-style="{ padding: '20px' }" style="margin-bottom:16px">
    <a-grid :cols="monSummary.length" :col-gap="16">
      <a-grid-item v-for="s in monSummary" :key="s.title" class="mon-sum">
        <a-statistic :title="s.title" :value="s.value" :precision="s.precision || 0" :value-style="{ color: s.color, fontWeight: 500 }">
          <template #suffix><span class="unit">{{ s.unit }}</span></template></a-statistic>
        <div class="muted">{{ s.sub }}</div>
      </a-grid-item>
    </a-grid>
  </a-card>

  <!-- 节点卡片（管理员） -->
  <a-grid v-if="monAll && (!isPublic || pub.showNodes)" class="node-grid" :cols="{ xs: 1, sm: 1, md: 2, lg: 2, xl: 3, xxl: 3 }" :col-gap="16" :row-gap="16" style="margin-bottom:16px">
    <a-grid-item v-for="n in monNodes" :key="n.id">
      <a-card class="general-card node-card" :class="{ offline: n.status !== 'online', active: monNode === n.id }" :hoverable="!isPublic || pub.showVms" @click="monNode = monNode === n.id ? 'all' : n.id">
        <template #title><a-space><span>{{ n.name }}</span><a-badge :status="nodeBadge[n.status].badge" :text="nodeBadge[n.status].text" /></a-space></template>
        <template #extra><span class="muted">{{ n.status === 'online' ? '运行 ' + n.uptime : '最后心跳 ' + n.lastSeen }}</span></template>
        <template v-if="n.status === 'online'">
          <div class="mon-metric">
            <span class="lbl">CPU</span>
            <a-progress :percent="n.cpu / 100" :color="lvl(n.cpu)" :show-text="false" />
            <span class="val">{{ n.cpu }}%<span class="muted"> · {{ n.cores }} 核</span></span>
            <svg class="spark" viewBox="0 0 60 20" preserveAspectRatio="none"><path :d="sparkPath(spark('n' + n.id, 'cpu', 30, n.cpu), 60, 20)" fill="none" :stroke="lvl(n.cpu)" stroke-width="1.5" /></svg>
          </div>
          <div class="mon-metric">
            <span class="lbl">内存</span>
            <a-progress :percent="n.mem / 100" :color="lvl(n.mem)" :show-text="false" />
            <span class="val">{{ (n.memTotal * n.mem / 100).toFixed(0) }} / {{ n.memTotal }} GB</span>
            <svg class="spark" viewBox="0 0 60 20" preserveAspectRatio="none"><path :d="sparkPath(spark('n' + n.id, 'mem', 30, n.mem), 60, 20)" fill="none" :stroke="lvl(n.mem)" stroke-width="1.5" /></svg>
          </div>
          <div class="mon-metric">
            <span class="lbl">磁盘</span>
            <a-progress :percent="n.disk / 100" :color="lvl(n.disk)" :show-text="false" />
            <span class="val">{{ (n.diskTotal * n.disk / 100).toFixed(2) }} / {{ n.diskTotal }} TB</span>
            <span class="spark"></span>
          </div>
          <div class="mon-metric">
            <a-tooltip content="CPU 等待磁盘 IO 的时间占比"><span class="lbl" style="cursor:help">IO 等待</span></a-tooltip>
            <a-progress :percent="Math.min(nodeIo[n.id].iowait * 4, 100) / 100" :color="busyOf(nodeIo[n.id].iowait * 4).color" :show-text="false" />
            <span class="val">{{ nodeIo[n.id].iowait }}%</span>
            <svg class="spark" viewBox="0 0 60 20" preserveAspectRatio="none"><path :d="sparkPath(spark('n' + n.id, 'iow', 30, nodeIo[n.id].iowait * 4), 60, 20)" fill="none" :stroke="busyOf(nodeIo[n.id].iowait * 4).color" stroke-width="1.5" /></svg>
          </div>
          <!-- 物理磁盘：每块两行，第一行设备与繁忙度，第二行进度条与 IOPS / 延迟 -->
          <div class="disk-list">
            <div v-for="d in nodeIo[n.id].disks" :key="d.dev" class="disk-item">
              <div class="disk-l1">
                <a-tooltip :content="d.model + ' · ' + d.pool + ' · 读 ' + fmtRate(d.rMB) + ' 写 ' + fmtRate(d.wMB)">
                  <span class="dev"><span class="mono">{{ d.dev }}</span> <a-tag size="small">{{ d.kind }}</a-tag></span></a-tooltip>
                <a-tag size="small" :color="busyOf(d.util, d.await).tag">{{ busyOf(d.util, d.await).text }} {{ d.util }}%</a-tag>
              </div>
              <div class="disk-l2">
                <a-progress :percent="d.util / 100" :color="busyOf(d.util, d.await).color" :show-text="false" size="small" />
                <span class="mono muted">{{ fmtK(d.rIops + d.wIops) }} IOPS</span>
                <span class="mono" :style="{ color: d.await >= 20 ? busyOf(0, d.await).color : 'var(--color-text-3)' }">{{ d.await }} ms</span>
              </div>
            </div>
          </div>
          <div class="mon-foot">
            <span>负载 <b class="mono">{{ n.load.split(' ')[0] }}</b></span>
            <span><icon-arrow-down style="color:rgb(var(--green-6))" /> {{ fmtRate(n.netIn) }} <icon-arrow-up style="color:rgb(var(--orange-6))" /> {{ fmtRate(n.netOut) }}</span>
            <span>虚拟机 <b>{{ vms.filter(v => v.node === n.id && v.status === 'running').length }}</b>/{{ vms.filter(v => v.node === n.id).length }}</span>
          </div>
        </template>
        <a-empty v-else description="节点离线，显示最后一次上报的数据" style="padding:18px 0" />
      </a-card>
    </a-grid-item>
  </a-grid>

  <!-- 虚拟机与容器 -->
  <a-card v-if="!isPublic || pub.showVms" class="general-card" :title="monAll ? '虚拟机与容器' : '我的虚拟机'">
    <template #extra>
      <a-space v-if="!isPublic">
        <span class="muted">更新于 {{ monUpdated }}</span>
        <a-select v-model="monRefresh" size="small" style="width:120px" :options="[{ label: '自动刷新 5s', value: '5s' }, { label: '自动刷新 10s', value: '10s' }, { label: '自动刷新 30s', value: '30s' }, { label: '暂停刷新', value: 'off' }]" />
      </a-space>
    </template>
    <a-row justify="space-between" align="center" style="margin-bottom:16px" :gutter="8">
      <a-space wrap>
        <a-input-search v-model="monKw" placeholder="名称 / VMID / IP" style="width:200px" allow-clear />
        <a-select v-if="monAll" v-model="monNode" style="width:140px" :options="[{ label: '全部节点', value: 'all' }, ...monNodes.map(n => ({ label: n.name, value: n.id }))]" />
        <a-radio-group v-model="monType" type="button"><a-radio value="all">全部</a-radio><a-radio value="qemu">VM</a-radio><a-radio value="lxc">CT</a-radio></a-radio-group>
        <a-radio-group v-model="monStatus" type="button"><a-radio value="all">全部状态</a-radio><a-radio value="running">运行中</a-radio><a-radio value="stopped">已停止</a-radio></a-radio-group>
      </a-space>
      <a-space>
        <span class="muted">显示</span>
        <a-radio-group v-model="monMode" type="button" size="small"><a-radio value="bars">进度条</a-radio><a-radio value="trend">趋势 1h</a-radio></a-radio-group>
        <template v-if="monAll"><span class="muted" style="margin-left:8px">按节点分组</span><a-switch v-model="monGroup" size="small" /></template>
      </a-space>
    </a-row>

    <a-table row-key="key" :data="monRows" :columns="monColumns" :pagination="false" :bordered="false" size="medium"
             v-model:expanded-keys="monExpanded" :indent-size="0" :span-method="monSpan" :row-class="r => r.group ? 'grp-row' : 'mon-row'"
             :scroll="{ x: monColumns.reduce((t, c) => t + c.width, 0) }" @row-click="r => !r.group && (!isPublic || pub.showDetail) && openMonVm(r)">
      <template #name="{ record }">
        <div v-if="record.group" class="grp">
          <icon-cloud /><span class="nm">{{ record.node.name }}</span>
          <a-badge :status="nodeBadge[record.node.status].badge" :text="nodeBadge[record.node.status].text" />
          <div class="info">
            <span>CPU <b>{{ record.node.cpu }}%</b></span><span>内存 <b>{{ record.node.mem }}%</b></span>
            <span>运行 <b>{{ record.children.filter(v => v.status === 'running').length }}</b> / {{ record.children.length }}</span>
          </div>
        </div>
        <template v-else><span class="circle" :class="{ pass: record.status === 'running' }"></span><b style="font-weight:500">{{ record.host }}</b> <span class="muted mono">{{ record.vmid }}</span></template>
      </template>
      <template #type="{ record }"><a-tag size="small" :color="record.type === 'qemu' ? 'arcoblue' : 'cyan'">{{ record.type === 'qemu' ? 'VM' : 'CT' }}</a-tag></template>
      <template #owner="{ record }"><a-tag v-if="record.shared" size="small" color="arcoblue">公共</a-tag><span v-else-if="record.owner">{{ record.owner }}</span><span v-else class="muted">未分配</span></template>
      <template #uptime="{ record }"><span :class="{ muted: record.status !== 'running' }">{{ record.status === 'running' ? record.uptime : '-' }}</span></template>
      <template #cpu="{ record }"><mon-cell :on="record.status === 'running'" :mode="monMode" :pct="record.cpu" :text="record.cpu + '%'" :sub="record.cores + ' 核'" :series="spark(record.id, 'cpu', 30, record.cpu)" /></template>
      <template #mem="{ record }"><mon-cell :on="record.status === 'running'" :mode="monMode" :pct="pct(record.memU, record.memT)" :text="pct(record.memU, record.memT) + '%'" :sub="record.memU + ' / ' + record.memT + ' GB'" :series="spark(record.id, 'mem', 30, pct(record.memU, record.memT))" /></template>
      <template #disk="{ record }"><mon-cell :on="true" mode="bars" :pct="pct(record.diskU, record.diskT)" :text="pct(record.diskU, record.diskT) + '%'" :sub="record.diskU + ' / ' + record.diskT + ' GB'" /></template>
      <template #io="{ record }"><div v-if="record.status === 'running'" class="updown">
        <a-tooltip :content="'读 ' + fmtRate(record.dr) + ' · 写 ' + fmtRate(record.dw)">
          <div><a-tag size="small" :color="vmBusy(record).tag">{{ vmBusy(record).text }}</a-tag> <span class="mono">{{ vmIo(record).lat }} ms</span></div></a-tooltip>
        <div class="muted mono">{{ fmtK(vmIo(record).iops) }} IOPS</div></div><span v-else class="muted">-</span></template>
      <template #net="{ record }"><div v-if="record.status === 'running'" class="updown"><div class="d"><icon-arrow-down /> {{ fmtRate(record.ni) }}</div><div class="u"><icon-arrow-up /> {{ fmtRate(record.no) }}</div></div><span v-else class="muted">-</span></template>
      <template #ip="{ record }"><div class="lines"><div class="mono">{{ record.v4 || '-' }}</div><div v-if="record.v6" class="mono muted">{{ record.v6 }}</div></div></template>
    </a-table>
  </a-card>

  <!-- 虚拟机详情抽屉 -->
  <a-drawer v-model:visible="monDrawer" :width="680" :footer="false" unmount-on-close>
    <template #title><a-space><span class="circle" :class="{ pass: monVm.status === 'running' }"></span>{{ monVm.host }} <span class="muted mono">{{ nodeOf(monVm.node).name }}/{{ monVm.vmid }}</span></a-space></template>
    <a-descriptions :column="3" size="small" :data="[
      { label: '类型', value: monVm.type === 'qemu' ? '虚拟机 (VM)' : '容器 (CT)' }, { label: '状态', value: monVm.status === 'running' ? '运行中 · ' + monVm.uptime : '已停止' },
      ...(isPublic && !pub.showOwner ? [] : [{ label: '归属', value: monVm.shared ? '公共' : (monVm.owner || '未分配') }]), { label: '配置', value: monVm.cores + ' 核 / ' + monVm.memT + ' GB / ' + monVm.diskT + ' GB' },
      ...(isPublic ? (pub.showIp ? [{ label: 'IPv4', value: monVm.v4 || '-' }] : []) : [{ label: 'IPv4', value: monVm.v4 || '-' }, { label: 'MAC', value: monVm.mac }, { label: '转发规则', value: vmRuleCount(monVm.id) + ' 条' }]) ]" />
    <a-divider />
    <a-row justify="space-between" style="margin-bottom:12px"><b>历史趋势</b>
      <a-radio-group v-model="monRange" type="button" size="small"><a-radio value="1h">1 小时</a-radio><a-radio value="24h">24 小时</a-radio><a-radio value="7d">7 天</a-radio></a-radio-group></a-row>
    <a-grid :cols="2" :col-gap="12" :row-gap="12">
      <a-grid-item v-for="c in monCharts" :key="c.title">
        <div class="mini-chart">
          <div class="mc-head"><span>{{ c.title }}</span><b>{{ c.now }}</b></div>
          <svg viewBox="0 0 300 90" preserveAspectRatio="none" style="width:100%;height:90px;display:block">
            <path :d="sparkPath(c.a, 300, 90) + ' L300 90 L0 90 Z'" :fill="c.color" fill-opacity=".1" />
            <path :d="sparkPath(c.a, 300, 90)" fill="none" :stroke="c.color" stroke-width="1.5" />
            <path v-if="c.b" :d="sparkPath(c.b, 300, 90)" fill="none" stroke="#ff7d00" stroke-width="1.5" />
          </svg>
          <div class="muted" style="display:flex;justify-content:space-between"><span>{{ c.from }}</span><span>{{ c.legend }}</span><span>现在</span></div>
        </div>
      </a-grid-item>
    </a-grid>
  </a-drawer>
</div>

<!-- ============================================================ 添加用户（分步表单） -->
<div v-else-if="page === 'user-new'" class="container">
  <a-breadcrumb class="container-breadcrumb"><a-breadcrumb-item><icon-apps /></a-breadcrumb-item><a-breadcrumb-item>用户管理</a-breadcrumb-item><a-breadcrumb-item>添加用户</a-breadcrumb-item></a-breadcrumb>
  <a-card class="general-card">
    <template #title>添加用户</template>
    <div class="step-wrapper">
      <a-steps :current="step" style="width: 760px" line-less class="steps">
        <a-step description="用户名与配额">账号信息</a-step>
        <a-step description="按节点分配端口">端口分配</a-step>
        <a-step description="选择 PVE 虚拟机">虚拟机</a-step>
        <a-step description="创建成功">完成</a-step>
      </a-steps>

      <a-form v-if="step === 1" :model="userForm" class="step-form" style="width:520px" :label-col-props="{ span: 6 }" :wrapper-col-props="{ span: 18 }">
        <a-form-item label="用户名" required :validate-status="stepErr.name ? 'error' : undefined" :help="stepErr.name">
          <a-input v-model="userForm.name" placeholder="字母、数字、下划线，3-20 位" /></a-form-item>
        <a-form-item label="密码" required :validate-status="stepErr.pwd ? 'error' : undefined" :help="stepErr.pwd">
          <a-input-password v-model="userForm.pwd" placeholder="至少 8 位" /></a-form-item>
        <a-form-item label="流量上限" extra="所有节点合计"><a-input-number v-model="userForm.quota" placeholder="留空为不限" :min="0"><template #append>GB</template></a-input-number></a-form-item>
        <a-form-item label="规则上限"><a-input-number v-model="userForm.maxRules" :min="1"><template #append>条</template></a-input-number></a-form-item>
        <a-form-item label="状态"><a-radio-group v-model="userForm.enabled"><a-radio :value="true">启用</a-radio><a-radio :value="false">禁用</a-radio></a-radio-group></a-form-item>
        <a-form-item label="备注"><a-textarea v-model="userForm.remark" placeholder="选填" :max-length="100" show-word-limit /></a-form-item>
        <a-form-item><a-button type="primary" @click="nextStep">下一步</a-button></a-form-item>
      </a-form>

      <a-form v-else-if="step === 2" :model="allocForm" class="step-form" style="width:720px" :label-col-props="{ span: 4 }" :wrapper-col-props="{ span: 20 }">
        <a-form-item label="节点" extra="端口按节点独立：不同节点可使用相同端口号">
          <a-radio-group v-model="allocForm.node" type="button"><a-radio v-for="n in readyNodes" :key="n.id" :value="n.id">{{ n.name }}</a-radio></a-radio-group></a-form-item>
        <a-form-item label="分配方式">
          <a-radio-group v-model="allocForm.type" type="button"><a-radio value="single">单个</a-radio><a-radio value="multi">多个</a-radio><a-radio value="range">范围</a-radio></a-radio-group></a-form-item>
        <a-form-item :label="{ single: '端口', multi: '端口列表', range: '端口范围' }[allocForm.type]" :validate-status="allocErr ? 'error' : undefined"
          :help="allocErr || '同一节点内端口不可重复；' + nodeOf(allocForm.node).name + ' 保留端口 ' + nodeOf(allocForm.node).reserved.join(' / ')">
          <a-space>

            <a-button size="small" @click="syncPve()"><template #icon><icon-sync /></template>立即同步</a-button></a-space>
        </a-row>
        <a-table row-key="id" :data="vmChoices" :pagination="false" :bordered="false" size="small" :scroll="{ y: 320 }"

            <a-table-column title="名称" data-index="host" :width="120" />

            <a-table-column title="内网 IP"><template #cell="{ record }">
              <template v-if="record.v4"><span class="mono">{{ record.v4 }}</span><span v-if="record.v6" class="muted mono"> / {{ record.v6 }}</span></template>
              <template v-else-if="vmPreview[record.id]"><span class="mono" style="color:rgb(var(--arcoblue-6))">{{ vmPreview[record.id].v4 }}</span> <a-tag size="small" color="arcoblue">保存后分配</a-tag></template>
              <span v-else class="muted">勾选后自动分配</span></template></a-table-column>
            <a-table-column title="归属" :width="110"><template #cell="{ record }">
              <a-tag v-if="record.owner && record.owner !== userForm.name" size="small">{{ record.owner }}</a-tag>
              <span v-else-if="record.owner" class="muted">当前用户</span><span v-else class="muted">未分配</span></template></a-table-column>
          </template>

        <a-alert style="margin-top:12px">已选 {{ selectedVms.length }} 台<template v-if="selectedVms.length">：{{ selectedVms.map(v => nodeOf(v.node).name + '/' + v.vmid + ' ' + v.host).join('，') }}</template>。保存后由对应节点的 Agent 按 MAC 自动分配内网 IP 并写入 DHCP 静态绑定。</a-alert>

        <div style="text-align:center;margin-top:32px"><a-space><a-button type="secondary" @click="step--">上一步</a-button><a-button type="primary" @click="nextStep">提交</a-button></a-space></div>
      </div>

      <div v-else class="success-wrap" style="width:100%">
        <a-result status="success" title="用户创建成功" :subtitle="'账号 ' + userForm.name + ' 已可登录，端口与虚拟机已下发到对应节点'" />
        <a-space :size="16"><a-button type="primary" @click="go('users')">查看用户列表</a-button><a-button type="secondary" @click="openNewUser">继续添加</a-button></a-space>

          <a-descriptions :column="2" :data="[

            { label: '流量上限', value: userForm.quota ? userForm.quota + ' GB' : '不限' }, { label: '规则上限', value: userForm.maxRules + ' 条' },
            { label: '端口', value: allocByNode(userForm).map(g => nodeOf(g.node).name + '：' + g.labels.join('、')).join('；') },
            { label: '虚拟机', value: selectedVms.map(v => nodeOf(v.node).name + '/' + v.vmid + ' ' + v.host + '（' + (v.v4 || (vmPreview[v.id] || {}).v4) + '）').join('，') } ]" />
        </div>
      </div>
    </div>
  </a-card>
</div>
